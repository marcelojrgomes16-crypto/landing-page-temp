<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Myrella</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #415a77 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #e0aaff;
            font-size: 42px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 8px rgba(224, 170, 255, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .coracoes {
            font-size: 40px;
            margin-bottom: 30px;
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .botoes {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn {
            padding: 18px 50px;
            font-size: 22px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-sim {
            background: linear-gradient(135deg, #e0aaff 0%, #c77dff 100%);
            color: #1b263b;
            box-shadow: 0 8px 25px rgba(224, 170, 255, 0.5);
            animation: brilhoBtn 2s infinite;
        }

        @keyframes brilhoBtn {
            0%, 100% { box-shadow: 0 8px 25px rgba(224, 170, 255, 0.5); }
            50% { box-shadow: 0 8px 40px rgba(224, 170, 255, 0.8); }
        }

        .btn-sim:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 35px rgba(224, 170, 255, 0.7);
        }

        .btn-nao {
            background: linear-gradient(135deg, #778da9 0%, #415a77 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(65, 90, 119, 0.5);
            position: relative;
        }

        .btn-nao:hover {
            background: linear-gradient(135deg, #415a77 0%, #1b263b 100%);
        }

        /* Tela de sucesso */
        .sucesso {
            display: none;
            text-align: center;
        }

        .sucesso h2 {
            color: #e0aaff;
            font-size: 48px;
            margin-bottom: 20px;
            animation: bounce 0.5s ease-in-out infinite alternate;
            text-shadow: 3px 3px 10px rgba(224, 170, 255, 0.6);
        }

        @keyframes bounce {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .sucesso .coracoes-grandes {
            font-size: 80px;
            animation: float 1s infinite ease-in-out;
        }

        /* Corações caindo */
        .heart {
            position: fixed;
            font-size: 24px;
            animation: fall linear forwards;
            pointer-events: none;
            z-index: 999;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Container biomedicina */
        .bio-container {
            margin: 30px auto;
            position: relative;
            width: 350px;
            height: 350px;
        }

        /* Elementos flutuantes */
        .elemento-flutuante {
            position: absolute;
            font-size: 24px;
            animation: flutua 3s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(224, 170, 255, 0.5));
        }

        @keyframes flutua {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* DNA Animation */
        .dna-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .dna-container svg {
            width: 100%;
            height: 100%;
        }

        /* Coração científico */
        .coracao-cientifico {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
        }

        .coracao-cientifico.aparecendo {
            animation: apareceCoracao 1.5s ease-out forwards;
        }

        @keyframes apareceCoracao {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0) rotate(-180deg); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        }

        .coracao-pulsante {
            animation: pulsaCoracao 1s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes pulsaCoracao {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Rosa na mão */
        .rosa-bio {
            position: absolute;
            bottom: 30px;
            right: 50px;
            opacity: 0;
        }

        .rosa-bio.aparecendo {
            animation: rosaAparece 1s ease-out forwards, rosaBalanca 2s ease-in-out infinite 1s;
        }

        @keyframes rosaAparece {
            0% { opacity: 0; transform: scale(0) rotate(-180deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        @keyframes rosaBalanca {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        /* Corações saindo */
        .coracao-bio {
            position: absolute;
            font-size: 18px;
            animation: sobeCora 2s ease-out infinite;
            opacity: 0;
        }

        @keyframes sobeCora {
            0% { 
                transform: translateY(0) scale(0.5) rotate(0deg); 
                opacity: 0;
            }
            20% { 
                opacity: 1;
            }
            100% { 
                transform: translateY(-100px) scale(1.3) rotate(30deg); 
                opacity: 0;
            }
        }

        /* Estrelas */
        .estrela {
            position: absolute;
            font-size: 16px;
            animation: piscaEstrela 1s ease-in-out infinite;
        }

        @keyframes piscaEstrela {
            0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.3) rotate(180deg); }
        }

        /* Texto */
        .texto-romantico {
            color: #e0aaff;
            font-size: 18px;
            margin-top: 15px;
            opacity: 0;
            animation: apareceTexto 1s ease-out forwards 2s;
        }

        @keyframes apareceTexto {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Células flutuando */
        .celula {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(224, 170, 255, 0.6) 0%, transparent 70%);
            animation: flutuaCelula 4s ease-in-out infinite;
        }

        @keyframes flutuaCelula {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
            50% { transform: translateY(-30px) scale(1.2); opacity: 0.8; }
        }

        /* Moléculas */
        .molecula {
            position: absolute;
            font-size: 20px;
            animation: gira 3s linear infinite;
        }

        @keyframes gira {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container" id="pergunta">
        <div class="coracoes">🧬💕🔬</div>
        <h1>Myrella, quer ser minha?</h1>
        <div class="botoes">
            <button class="btn btn-sim" onclick="responderSim()">Sim 💕</button>
            <button class="btn btn-nao" id="btnNao" onmouseenter="fugir()" onclick="fugir()">Não 😢</button>
        </div>
    </div>

    <div class="sucesso" id="sucesso">
        <div class="coracoes-grandes">🧬❤️🔬</div>
        <h2>EU SABIA! 💕</h2>
        <p style="color: #e0aaff; font-size: 24px; margin-top: 20px;">Agora somos oficialmente um casal!</p>
        
        <!-- Container biomedicina -->
        <div class="bio-container">
            <!-- Elementos flutuantes -->
            <div class="elemento-flutuante" style="top: 20px; left: 30px; animation-delay: 0s;">🧬</div>
            <div class="elemento-flutuante" style="top: 60px; right: 40px; animation-delay: 0.5s;">🔬</div>
            <div class="elemento-flutuante" style="bottom: 80px; left: 20px; animation-delay: 1s;">💉</div>
            <div class="elemento-flutuante" style="bottom: 40px; right: 30px; animation-delay: 1.5s;">🧪</div>
            <div class="elemento-flutuante" style="top: 100px; left: 10px; animation-delay: 0.3s;">💊</div>
            <div class="elemento-flutuante" style="top: 150px; right: 20px; animation-delay: 0.8s;">🩺</div>
            
            <!-- Células flutuando -->
            <div class="celula" style="top: 40px; left: 80px; animation-delay: 0s;"></div>
            <div class="celula" style="top: 120px; right: 60px; animation-delay: 0.5s;"></div>
            <div class="celula" style="bottom: 100px; left: 60px; animation-delay: 1s;"></div>
            <div class="celula" style="bottom: 60px; right: 80px; animation-delay: 1.5s;"></div>
            
            <!-- Moléculas -->
            <div class="molecula" style="top: 30px; left: 150px; animation-delay: 0s;">⚛️</div>
            <div class="molecula" style="bottom: 50px; right: 100px; animation-delay: 1s;">🔬</div>
            
            <!-- Corações saindo -->
            <div class="coracao-bio" style="left: 120px; top: 20px; animation-delay: 0s;">💕</div>
            <div class="coracao-bio" style="left: 180px; top: 10px; animation-delay: 0.7s;">💗</div>
            <div class="coracao-bio" style="left: 240px; top: 30px; animation-delay: 1.4s;">💖</div>
            
            <!-- Estrelas -->
            <div class="estrela" style="top: 10px; left: 40px; animation-delay: 0s;">✨</div>
            <div class="estrela" style="top: 30px; right: 50px; animation-delay: 0.3s;">⭐</div>
            <div class="estrela" style="bottom: 70px; left: 20px; animation-delay: 0.6s;">✨</div>
            <div class="estrela" style="bottom: 50px; right: 40px; animation-delay: 0.9s;">⭐</div>
            
            <!-- DNA girando -->
            <div class="dna-container">
                <svg viewBox="0 0 200 300" width="200" height="300">
                    <!-- Dupla hélice DNA -->
                    <g>
                        <!-- Hélice 1 -->
                        <path d="M 60 30 Q 140 75 60 120 Q 140 165 60 210 Q 140 255 60 300" 
                              stroke="#e0aaff" stroke-width="4" fill="none" stroke-linecap="round">
                            <animate attributeName="d" 
                                     values="M 60 30 Q 140 75 60 120 Q 140 165 60 210 Q 140 255 60 300;
                                             M 140 30 Q 60 75 140 120 Q 60 165 140 210 Q 60 255 140 300;
                                             M 60 30 Q 140 75 60 120 Q 140 165 60 210 Q 140 255 60 300"
                                     dur="4s" repeatCount="indefinite"/>
                        </path>
                        
                        <!-- Hélice 2 -->
                        <path d="M 140 30 Q 60 75 140 120 Q 60 165 140 210 Q 60 255 140 300" 
                              stroke="#c77dff" stroke-width="4" fill="none" stroke-linecap="round">
                            <animate attributeName="d" 
                                     values="M 140 30 Q 60 75 140 120 Q 60 165 140 210 Q 60 255 140 300;
                                             M 60 30 Q 140 75 60 120 Q 140 165 60 210 Q 140 255 60 300;
                                             M 140 30 Q 60 75 140 120 Q 60 165 140 210 Q 60 255 140 300"
                                     dur="4s" repeatCount="indefinite"/>
                        </path>
                        
                        <!-- Conexões entre as hélices (pares de bases) -->
                        <g>
                            <line x1="80" y1="50" x2="120" y2="50" stroke="#778da9" stroke-width="3" stroke-linecap="round">
                                <animate attributeName="x1" values="80;120;80" dur="4s" repeatCount="indefinite"/>
                                <animate attributeName="x2" values="120;80;120" dur="4s" repeatCount="indefinite"/>
                            </line>
                            <circle cx="80" cy="50" r="5" fill="#e0aaff">
                                <animate attributeName="cx" values="80;120;80" dur="4s" repeatCount="indefinite"/>
                            </circle>
                            <circle cx="120" cy="50" r="5" fill="#c77dff">
                                <animate attributeName="cx" values="120;80;120" dur="4s" repeatCount="indefinite"/>
                            </circle>
                        </g>
                        <g>
                            <line x1="85" y1="90" x2="115" y2="90" stroke="#778da9" stroke-width="3" stroke-linecap="round">
                                <animate attributeName="x1" values="85;115;85" dur="4s" repeatCount="indefinite"/>
                                <animate attributeName="x2" values="115;85;115" dur="4s" repeatCount="indefinite"/>
                            </line>
                            <circle cx="85" cy="90" r="5" fill="#e0aaff">
                                <animate attributeName="cx" values="85;115;85" dur="4s" repeatCount="indefinite"/>
                            </circle>
                            <circle cx="115" cy="90" r="5" fill="#c77dff">
                                <animate attributeName="cx" values="115;85;115" dur="4s" repeatCount="indefinite"/>
                            </circle>
                        </g>
                        <g>
                            <line x1="75" y1="130" x2="125" y2="130" stroke="#778da9" stroke-width="3" stroke-linecap="round">
                                <animate attributeName="x1" values="75;125;75" dur="4s" repeatCount="indefinite"/>
                                <animate attributeName="x2" values="125;75;125" dur="4s" repeatCount="indefinite"/>
                            </line>
                            <circle cx="75" cy="130" r="5" fill="#e0aaff">
                                <animate attributeName="cx" values="75;125;75" dur="4s" repeatCount="indefinite"/>
                            </circle>
                            <circle cx="125" cy="130" r="5" fill="#c77dff">
                                <animate attributeName="cx" values="125;75;125" dur="4s" repeatCount="indefinite"/>
                            </circle>
                        </g>
                        <g>
                            <line x1="80" y1="170" x2="120" y2="170" stroke="#778da9" stroke-width="3" stroke-linecap="round">
                                <animate attributeName="x1" values="80;120;80" dur="4s" repeatCount="indefinite"/>
                                <animate attributeName="x2" values="120;80;120" dur="4s" repeatCount="indefinite"/>
                            </line>
                            <circle cx="80" cy="170" r="5" fill="#e0aaff">
                                <animate attributeName="cx" values="80;120;80" dur="4s" repeatCount="indefinite"/>
                            </circle>
                            <circle cx="120" cy="170" r="5" fill="#c77dff">
                                <animate attributeName="cx" values="120;80;120" dur="4s" repeatCount="indefinite"/>
                            </circle>
                        </g>
                        <g>
                            <line x1="85" y1="210" x2="115" y2="210" stroke="#778da9" stroke-width="3" stroke-linecap="round">
                                <animate attributeName="x1" values="85;115;85" dur="4s" repeatCount="indefinite"/>
                                <animate attributeName="x2" values="115;85;115" dur="4s" repeatCount="indefinite"/>
                            </line>
                            <circle cx="85" cy="210" r="5" fill="#e0aaff">
                                <animate attributeName="cx" values="85;115;85" dur="4s" repeatCount="indefinite"/>
                            </circle>
                            <circle cx="115" cy="210" r="5" fill="#c77dff">
                                <animate attributeName="cx" values="115;85;115" dur="4s" repeatCount="indefinite"/>
                            </circle>
                        </g>
                        <g>
                            <line x1="75" y1="250" x2="125" y2="250" stroke="#778da9" stroke-width="3" stroke-linecap="round">
                                <animate attributeName="x1" values="75;125;75" dur="4s" repeatCount="indefinite"/>
                                <animate attributeName="x2" values="125;75;125" dur="4s" repeatCount="indefinite"/>
                            </line>
                            <circle cx="75" cy="250" r="5" fill="#e0aaff">
                                <animate attributeName="cx" values="75;125;75" dur="4s" repeatCount="indefinite"/>
                            </circle>
                            <circle cx="125" cy="250" r="5" fill="#c77dff">
                                <animate attributeName="cx" values="125;75;125" dur="4s" repeatCount="indefinite"/>
                            </circle>
                        </g>
                    </g>
                </svg>
            </div>
            
            <!-- Coração científico -->
            <div class="coracao-cientifico" id="coracaoCientifico">
                <svg viewBox="0 0 150 150" width="150" height="150">
                    <!-- Coração -->
                    <path class="coracao-pulsante" d="M75 130 C75 130, 10 80, 10 45 C10 20, 30 10, 50 25 C60 32, 70 45, 75 55 C80 45, 90 32, 100 25 C120 10, 140 20, 140 45 C140 80, 75 130, 75 130" 
                          fill="url(#gradCoracao)" stroke="#e0aaff" stroke-width="2"/>
                    
                    <!-- Moléculas no coração -->
                    <circle cx="40" cy="50" r="8" fill="#c77dff" opacity="0.8">
                        <animate attributeName="r" values="8;10;8" dur="1s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="110" cy="50" r="8" fill="#c77dff" opacity="0.8">
                        <animate attributeName="r" values="8;10;8" dur="1s" repeatCount="indefinite" begin="0.5s"/>
                    </circle>
                    <circle cx="75" cy="80" r="10" fill="#e0aaff" opacity="0.8">
                        <animate attributeName="r" values="10;13;10" dur="1s" repeatCount="indefinite"/>
                    </circle>
                    
                    <!-- Símbolo de DNA no centro -->
                    <text x="75" y="85" font-size="20" text-anchor="middle" fill="#1b263b">🧬</text>
                    
                    <!-- Brilho -->
                    <circle cx="75" cy="75" r="60" fill="none" stroke="#e0aaff" stroke-width="1" opacity="0.5">
                        <animate attributeName="r" values="55;65;55" dur="2s" repeatCount="indefinite"/>
                        <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
                    </circle>
                    
                    <defs>
                        <linearGradient id="gradCoracao" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#e0aaff;stop-opacity:0.8" />
                            <stop offset="50%" style="stop-color:#c77dff;stop-opacity:0.9" />
                            <stop offset="100%" style="stop-color:#7b2cbf;stop-opacity:0.8" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            
            <!-- Rosa -->
            <div class="rosa-bio" id="rosaBio">
                <svg viewBox="0 0 80 120" width="80" height="120">
                    <!-- Caule -->
                    <line x1="40" y1="120" x2="40" y2="50" stroke="#228B22" stroke-width="4"/>
                    
                    <!-- Folhas -->
                    <ellipse cx="30" cy="80" rx="12" ry="6" fill="#228B22" transform="rotate(-30 30 80)"/>
                    <ellipse cx="50" cy="75" rx="12" ry="6" fill="#228B22" transform="rotate(30 50 75)"/>
                    <ellipse cx="35" cy="95" rx="10" ry="5" fill="#2d5016" transform="rotate(-20 35 95)"/>
                    
                    <!-- Rosa -->
                    <circle cx="40" cy="40" r="22" fill="#e94560"/>
                    <circle cx="40" cy="40" r="16" fill="#ff6b81"/>
                    <circle cx="40" cy="40" r="10" fill="#ffb6c1"/>
                    <circle cx="40" cy="40" r="5" fill="#fff"/>
                    
                    <!-- Pétalas -->
                    <path d="M 28 32 Q 40 20 52 32" stroke="#e94560" stroke-width="2" fill="none"/>
                    <path d="M 28 48 Q 40 60 52 48" stroke="#e94560" stroke-width="2" fill="none"/>
                    <path d="M 23 40 Q 18 35 23 28" stroke="#e94560" stroke-width="2" fill="none"/>
                    <path d="M 57 40 Q 62 35 57 28" stroke="#e94560" stroke-width="2" fill="none"/>
                </svg>
            </div>
        </div>
        
        <p class="texto-romantico">Nossa amor é como o DNA: único e inseparável! 🧬💕</p>
        
        <div class="coracoes-grandes" style="margin-top: 20px;">🧬💕🔬</div>
    </div>

    <script>
        let cliqueCount = 0;
        const btnNao = document.getElementById('btnNao');

        function fugir() {
            cliqueCount++;
            
            const larguraTela = window.innerWidth;
            const alturaTela = window.innerHeight;
            
            const novaX = Math.random() * (larguraTela - 250);
            const novaY = Math.random() * (alturaTela - 100);
            
            btnNao.style.left = novaX + 'px';
            btnNao.style.top = novaY + 'px';
            btnNao.style.position = 'fixed';
            
            // NÃO muda o tamanho
            btnNao.style.fontSize = '22px';
            btnNao.style.padding = '18px 50px';
            
            // Texto muda
            const textos = ['Não 😢', 'Ah não...', 'Por favor!', 'Não fui...', 'Tá bom 😭', 'Sem chance!', 'Esquece...', 'Nunca! 🧬'];
            btnNao.textContent = textos[Math.min(cliqueCount, textos.length - 1)];
        }

        function responderSim() {
            document.getElementById('pergunta').style.display = 'none';
            document.getElementById('sucesso').style.display = 'block';
            montarBiomedicina();
            criarCoracoes();
        }

        function montarBiomedicina() {
            const coracao = document.getElementById('coracaoCientifico');
            const rosa = document.getElementById('rosaBio');
            
            // Coração aparece
            setTimeout(() => {
                coracao.classList.add('aparecendo');
                
                // Rosa aparece depois
                setTimeout(() => {
                    rosa.classList.add('aparecendo');
                }, 1500);
            }, 500);
        }

        function criarCoracoes() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = ['🧬', '💕', '🔬', '💗', '💉', '✨', '🧪', '💖'][Math.floor(Math.random() * 8)];
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.top = '-50px';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.body.appendChild(heart);
            
            setTimeout(() => heart.remove(), 5000);
        }

        // Criar elementos caindo
        setInterval(criarCoracoes, 350);

        // Mover botão com mouse
        document.addEventListener('mousemove', (e) => {
            if (btnNao.style.position !== 'fixed') return;
            
            const btnRect = btnNao.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;
            
            const distX = e.clientX - btnCenterX;
            const distY = e.clientY - btnCenterY;
            const distancia = Math.sqrt(distX * distX + distY * distY);
            
            if (distancia < 130) {
                fugir();
            }
        });
    </script>
</body>
</html>
