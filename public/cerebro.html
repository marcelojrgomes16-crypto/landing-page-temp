<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cérebro Digital</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a1a; font-family: 'Segoe UI', system-ui, sans-serif; }
canvas { display: block; }

#title {
  position: fixed; top: 20px; left: 0; right: 0; text-align: center;
  font-size: 2rem; font-weight: 700; z-index: 10; pointer-events: none;
  background: linear-gradient(90deg, #00e5ff, #7c4dff, #ff4081, #00e5ff);
  background-size: 300% 100%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: shimmer 4s ease-in-out infinite;
  text-shadow: 0 0 40px rgba(0,229,255,0.3);
  letter-spacing: 2px;
}
@keyframes shimmer { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }

#status-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
  display: flex; justify-content: center; gap: 30px; padding: 12px 20px;
  background: rgba(10,10,26,0.85); backdrop-filter: blur(10px);
  border-top: 1px solid rgba(0,229,255,0.15); font-size: 0.8rem; color: #8899aa;
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: #00e676; display: inline-block; margin-right: 6px; animation: pulse-dot 2s infinite; }
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.3} }

#instructions {
  position: fixed; bottom: 50px; left: 0; right: 0; text-align: center;
  font-size: 0.75rem; color: rgba(255,255,255,0.25); z-index: 10; pointer-events: none;
}

#modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
  justify-content: center; align-items: center;
}
#modal-overlay.active { display: flex; }
#modal {
  background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
  border: 1px solid rgba(0,229,255,0.2); border-radius: 16px;
  padding: 32px; max-width: 420px; width: 90%; text-align: center;
  box-shadow: 0 0 60px rgba(0,229,255,0.1); animation: modal-in 0.3s ease;
}
@keyframes modal-in { from{opacity:0;transform:scale(0.9)} to{opacity:1;transform:scale(1)} }
#modal h2 { color: #fff; font-size: 1.4rem; margin-bottom: 8px; }
#modal .modal-emoji { font-size: 3rem; margin-bottom: 12px; }
#modal p { color: #8899aa; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }
#modal a {
  display: inline-block; padding: 10px 28px; background: linear-gradient(135deg, #00e5ff, #7c4dff);
  color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600;
  transition: transform 0.2s, box-shadow 0.2s;
}
#modal a:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,229,255,0.4); }
#modal-close {
  position: absolute; top: 12px; right: 16px; background: none; border: none;
  color: #556; font-size: 1.5rem; cursor: pointer;
}
</style>
</head>
<body>

<div id="title">Cérebro Digital</div>

<div id="instructions">Arraste para girar &bull; Clique nos nós para acessar</div>

<div id="status-bar">
  <span><span class="status-dot"></span>Sistema Online</span>
  <span>6 Projetos Ativos</span>
  <span id="clock"></span>
</div>

<div id="modal-overlay">
  <div id="modal">
    <button id="modal-close">&times;</button>
    <div class="modal-emoji" id="modal-emoji"></div>
    <h2 id="modal-title"></h2>
    <p id="modal-desc"></p>
    <a id="modal-link" href="#" target="_blank">Acessar</a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const PROJECTS = [
  { emoji:'🍷', name:'Adega To Chegando', desc:'Sistema de controle de estoque para distribuidora de bebidas.', url:'https://estoque-distribuidora-th3q.onrender.com/' },
  { emoji:'💕', name:'Para Myrella', desc:'Landing page personalizada com design moderno e interativo.', url:'https://landing-page-temp.onrender.com/' },
  { emoji:'🧬', name:'Biomedicina', desc:'Plataforma de informações e serviços de biomedicina.', url:'https://landing-page-temp.onrender.com/' },
  { emoji:'📦', name:'Controle de Estoque', desc:'Módulo de gestão de estoque para consumidor final.', url:'https://estoque-distribuidora-th3q.onrender.com/consumidor.html' },
  { emoji:'⚡', name:'API REST', desc:'Endpoint de health check e serviços RESTful.', url:'https://estoque-distribuidora-th3q.onrender.com/api/health' },
  { emoji:'🚀', name:'Deploy', desc:'Plataforma de deploy e hospedagem de aplicações.', url:'https://render.com' }
];

// Clock
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('pt-BR');
}
updateClock(); setInterval(updateClock, 1000);

// Modal
const overlay = document.getElementById('modal-overlay');
document.getElementById('modal-close').onclick = () => overlay.classList.remove('active');
overlay.onclick = (e) => { if (e.target === overlay) overlay.classList.remove('active'); };

function openModal(p) {
  document.getElementById('modal-emoji').textContent = p.emoji;
  document.getElementById('modal-title').textContent = p.name;
  document.getElementById('modal-desc').textContent = p.desc;
  document.getElementById('modal-link').href = p.url;
  overlay.classList.add('active');
}

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.012);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.AmbientLight(0x334455, 0.6));
const pLight = new THREE.PointLight(0xff6644, 1.5, 30);
pLight.position.set(0, 0, 0);
scene.add(pLight);
const pLight2 = new THREE.PointLight(0x4488ff, 0.8, 40);
pLight2.position.set(5, 5, 5);
scene.add(pLight2);

// Stars
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(2000 * 3);
for (let i = 0; i < 2000; i++) {
  const r = 40 + Math.random() * 80;
  const t = Math.random() * Math.PI * 2;
  const p = Math.acos(2 * Math.random() - 1);
  starPos[i*3] = r * Math.sin(p) * Math.cos(t);
  starPos[i*3+1] = r * Math.sin(p) * Math.sin(t);
  starPos[i*3+2] = r * Math.cos(p);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, sizeAttenuation: true })));

// Atom group
const atomGroup = new THREE.Group();
scene.add(atomGroup);

// --- NUCLEUS ---
const nucleusGroup = new THREE.Group();
atomGroup.add(nucleusGroup);

const protonMat = new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0xff2222, emissiveIntensity: 0.3, roughness: 0.4, metalness: 0.2 });
const neutronMat = new THREE.MeshStandardMaterial({ color: 0x888899, emissive: 0x555566, emissiveIntensity: 0.2, roughness: 0.5, metalness: 0.1 });
const sphereGeo = new THREE.SphereGeometry(0.42, 16, 16);

// Place nucleons in clustered formation
const nucleonPositions = [];
const layers = [
  { count: 4, r: 0, y: 0 },
  { count: 8, r: 0.7, y: 0 },
  { count: 6, r: 0.5, y: 0.55 },
  { count: 6, r: 0.5, y: -0.55 },
  { count: 4, r: 0.3, y: 1.0 },
  { count: 4, r: 0.3, y: -1.0 }
];
let idx = 0;
layers.forEach(layer => {
  for (let i = 0; i < layer.count; i++) {
    const angle = (i / layer.count) * Math.PI * 2 + Math.random() * 0.3;
    const rr = layer.r * (0.7 + Math.random() * 0.6);
    nucleonPositions.push(new THREE.Vector3(
      Math.cos(angle) * rr,
      layer.y + (Math.random() - 0.5) * 0.3,
      Math.sin(angle) * rr
    ));
    idx++;
  }
});

nucleonPositions.forEach((pos, i) => {
  const mat = i < 12 ? protonMat : neutronMat;
  const mesh = new THREE.Mesh(sphereGeo, mat);
  mesh.position.copy(pos);
  nucleusGroup.add(mesh);
});

// Nucleus glow
const glowGeo = new THREE.SphereGeometry(1.6, 32, 32);
const glowMat = new THREE.MeshBasicMaterial({
  color: 0xff4444, transparent: true, opacity: 0.08, side: THREE.BackSide
});
nucleusGroup.add(new THREE.Mesh(glowGeo, glowMat));
const glowGeo2 = new THREE.SphereGeometry(2.2, 32, 32);
const glowMat2 = new THREE.MeshBasicMaterial({
  color: 0xff2244, transparent: true, opacity: 0.04, side: THREE.BackSide
});
nucleusGroup.add(new THREE.Mesh(glowGeo2, glowMat2));

// --- ORBITAL PATHS & ELECTRONS ---
const orbitalDefs = [
  { rx: 8, rz: 5, tiltX: 0, tiltZ: 0, speed: 0.25, color: 0x00e5ff, startAngle: 0 },
  { rx: 6, rz: 10, tiltX: 60, tiltZ: 0, speed: 0.18, color: 0x7c4dff, startAngle: 2.1 },
  { rx: 9, rz: 4, tiltX: -60, tiltZ: 0, speed: 0.32, color: 0x00bcd4, startAngle: 4.2 },
  { rx: 5, rz: 7, tiltX: 90, tiltZ: 0, speed: 0.22, color: 0x448aff, startAngle: 1.0 }
];

const electrons = [];
const trails = [];

orbitalDefs.forEach((def, i) => {
  const orbitalGroup = new THREE.Group();
  orbitalGroup.rotation.x = THREE.MathUtils.degToRad(def.tiltX);
  orbitalGroup.rotation.z = THREE.MathUtils.degToRad(def.tiltZ);
  atomGroup.add(orbitalGroup);

  // Draw elliptical path
  const curve = new THREE.EllipseCurve(0, 0, def.rx, def.rz, 0, 2 * Math.PI, false, 0);
  const pts = curve.getPoints(128);
  const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
  const lineMat = new THREE.LineBasicMaterial({ color: def.color, transparent: true, opacity: 0.2 });
  const line = new THREE.LineLoop(lineGeo, lineMat);
  orbitalGroup.add(line);

  // Glow ring
  const ringGeo = new THREE.RingGeometry(def.rx - 0.08, def.rx + 0.08, 64);
  // We'll skip ring geometry for simplicity and use the line

  // Electron sphere
  const eMat = new THREE.MeshBasicMaterial({ color: def.color });
  const eGeo = new THREE.SphereGeometry(0.2, 12, 12);
  const electron = new THREE.Mesh(eGeo, eMat);
  orbitalGroup.add(electron);

  // Electron glow
  const eGlowMat = new THREE.MeshBasicMaterial({ color: def.color, transparent: true, opacity: 0.3 });
  const eGlow = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 12), eGlowMat);
  orbitalGroup.add(eGlow);

  // Trail
  const trailLen = 20;
  const trailPositions = new Float32Array(trailLen * 3);
  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
  const trailMat = new THREE.LineBasicMaterial({ color: def.color, transparent: true, opacity: 0.4 });
  const trail = new THREE.Line(trailGeo, trailMat);
  orbitalGroup.add(trail);

  // Small particles near electron
  const partCount = 6;
  const partGeo = new THREE.BufferGeometry();
  const partPos = new Float32Array(partCount * 3);
  partGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
  const partMat = new THREE.PointsMaterial({ color: def.color, size: 0.08, transparent: true, opacity: 0.6 });
  const particles = new THREE.Points(partGeo, partMat);
  orbitalGroup.add(particles);

  electrons.push({ orbital: orbitalGroup, curve, electron, eGlow, def, angle: def.startAngle, trail, trailGeo, trailPositions, trailLen, particles, partGeo, partPos, partCount });
});

// Nucleus ambient glow particles
const nucleonPartCount = 30;
const nucleonPartGeo = new THREE.BufferGeometry();
const nucleonPartPos = new Float32Array(nucleonPartCount * 3);
for (let i = 0; i < nucleonPartCount; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 1.0 + Math.random() * 0.8;
  nucleonPartPos[i*3] = Math.cos(a) * r;
  nucleonPartPos[i*3+1] = (Math.random()-0.5) * 1.6;
  nucleonPartPos[i*3+2] = Math.sin(a) * r;
}
nucleonPartGeo.setAttribute('position', new THREE.BufferAttribute(nucleonPartPos, 3));
const nucleonPartMat = new THREE.PointsMaterial({ color: 0xff6644, size: 0.12, transparent: true, opacity: 0.4 });
nucleusGroup.add(new THREE.Points(nucleonPartGeo, nucleonPartMat));

// --- PROJECT NODES ---
const nodeGroup = new THREE.Group();
atomGroup.add(nodeGroup);

const nodeMeshes = [];
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

PROJECTS.forEach((p, i) => {
  const angle = (i / PROJECTS.length) * Math.PI * 2;
  const r = 14;
  const y = (Math.random() - 0.5) * 3;
  const x = Math.cos(angle) * r;
  const z = Math.sin(angle) * r;

  // Node sphere
  const nGeo = new THREE.SphereGeometry(0.35, 16, 16);
  const nMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff });
  const node = new THREE.Mesh(nGeo, nMat);
  node.position.set(x, y, z);
  node.userData = { project: p };
  nodeGroup.add(node);

  // Node glow
  const ngGeo = new THREE.SphereGeometry(0.6, 16, 16);
  const ngMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.15 });
  const nGlow = new THREE.Mesh(ngGeo, ngMat);
  node.add(nGlow);

  // Line to center
  const lineGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(x, y, z)
  ]);
  const lineMat = new THREE.LineBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.08 });
  nodeGroup.add(new THREE.Line(lineGeo, lineMat));

  // Canvas sprite for emoji
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.font = '64px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(p.emoji, 64, 64);
  const tex = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(1.2, 1.2, 1);
  sprite.position.set(x, y + 0.8, z);
  nodeGroup.add(sprite);

  // Label
  const lCanvas = document.createElement('canvas');
  lCanvas.width = 256; lCanvas.height = 64;
  const lCtx = lCanvas.getContext('2d');
  lCtx.font = 'bold 22px Segoe UI, sans-serif';
  lCtx.fillStyle = '#ffffff';
  lCtx.textAlign = 'center';
  lCtx.fillText(p.name, 128, 36);
  const lTex = new THREE.CanvasTexture(lCanvas);
  const lMat = new THREE.SpriteMaterial({ map: lTex, transparent: true });
  const label = new THREE.Sprite(lMat);
  label.scale.set(3, 0.75, 1);
  label.position.set(x, y - 0.7, z);
  nodeGroup.add(label);

  nodeMeshes.push(node);
});

// --- MOUSE INTERACTION ---
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let rotVel = { x: 0, y: 0 };
const autoRotateSpeed = 0.0003;

renderer.domElement.addEventListener('mousedown', (e) => {
  isDragging = true;
  prevMouse = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  rotVel.x = dy * 0.005;
  rotVel.y = dx * 0.005;
  prevMouse = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('mouseup', () => isDragging = false);
renderer.domElement.addEventListener('mouseleave', () => isDragging = false);

// Touch
renderer.domElement.addEventListener('touchstart', (e) => {
  isDragging = true;
  prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
renderer.domElement.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  const dx = e.touches[0].clientX - prevMouse.x;
  const dy = e.touches[0].clientY - prevMouse.y;
  rotVel.x = dy * 0.005;
  rotVel.y = dx * 0.005;
  prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
renderer.domElement.addEventListener('touchend', () => isDragging = false);

// Click on nodes
renderer.domElement.addEventListener('click', (e) => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(nodeMeshes);
  if (hits.length > 0) openModal(hits[0].object.userData.project);
});

// Resize
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// --- ANIMATE ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Auto rotate
  if (!isDragging) {
    rotVel.y += autoRotateSpeed;
    rotVel.x *= 0.95;
  }
  rotVel.y *= 0.98;
  rotVel.x *= 0.98;

  atomGroup.rotation.x += rotVel.x;
  atomGroup.rotation.y += rotVel.y;

  // Nucleus wobble
  nucleusGroup.rotation.x = Math.sin(t * 0.8) * 0.03;
  nucleusGroup.rotation.z = Math.cos(t * 0.6) * 0.025;
  nucleusGroup.position.y = Math.sin(t * 0.5) * 0.03;

  // Electrons
  electrons.forEach((e) => {
    e.angle += e.def.speed * 0.008;
    const pos = e.curve.getPointAt(((e.angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / (Math.PI * 2));
    e.electron.position.set(pos.x, 0, pos.y);
    e.eGlow.position.copy(e.electron.position);

    // Trail
    e.trailPositions.copyWithin(3);
    e.trailPositions[e.trailLen * 3 - 3] = pos.x;
    e.trailPositions[e.trailLen * 3 - 2] = 0;
    e.trailPositions[e.trailLen * 3 - 1] = pos.y;
    e.trailGeo.attributes.position.needsUpdate = true;

    // Particles around electron
    for (let j = 0; j < e.partCount; j++) {
      const pa = Math.random() * Math.PI * 2;
      const pr = 0.2 + Math.random() * 0.3;
      e.partPos[j*3] = pos.x + Math.cos(pa) * pr;
      e.partPos[j*3+1] = (Math.random()-0.5) * 0.4;
      e.partPos[j*3+2] = pos.y + Math.sin(pa) * pr;
    }
    e.partGeo.attributes.position.needsUpdate = true;
  });

  // Node pulse
  nodeMeshes.forEach((n, i) => {
    const s = 1 + Math.sin(t * 2 + i) * 0.1;
    n.children[0].scale.set(s, s, s);
  });

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
