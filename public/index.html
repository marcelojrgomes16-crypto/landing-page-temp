<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Myrella</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 50%, #ff6b9d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: white;
            font-size: 42px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .coracoes {
            font-size: 40px;
            margin-bottom: 30px;
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .botoes {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn {
            padding: 18px 50px;
            font-size: 22px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-sim {
            background: #2ecc71;
            color: white;
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
        }

        .btn-sim:hover {
            background: #27ae60;
            transform: scale(1.1);
        }

        .btn-nao {
            background: #e74c3c;
            color: white;
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4);
            position: relative;
        }

        .btn-nao:hover {
            background: #c0392b;
        }

        /* Tela de sucesso */
        .sucesso {
            display: none;
            text-align: center;
        }

        .sucesso h2 {
            color: white;
            font-size: 48px;
            margin-bottom: 20px;
            animation: bounce 0.5s ease-in-out infinite alternate;
        }

        @keyframes bounce {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .sucesso .coracoes-grandes {
            font-size: 80px;
            animation: float 1s infinite ease-in-out;
        }

        /* Corações caindo */
        .heart {
            position: fixed;
            font-size: 24px;
            animation: fall linear forwards;
            pointer-events: none;
            z-index: 999;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Pantera animada */
        .pantera-container {
            margin: 30px auto;
            position: relative;
            width: 250px;
            height: 200px;
        }

        .pantera {
            position: absolute;
            animation: andar 2s ease-in-out infinite;
        }

        @keyframes andar {
            0%, 100% { 
                transform: translateX(-30px) scaleX(1); 
            }
            25% { 
                transform: translateX(0px) scaleX(1) translateY(-5px); 
            }
            50% { 
                transform: translateX(30px) scaleX(1); 
            }
            75% { 
                transform: translateX(0px) scaleX(1) translateY(-5px); 
            }
        }

        /* Pernas animadas */
        .perna-dianteira-esq {
            animation: pernaFrente 0.3s ease-in-out infinite alternate;
            transform-origin: top center;
        }
        .perna-dianteira-dir {
            animation: pernaFrente 0.3s ease-in-out infinite alternate-reverse;
            transform-origin: top center;
        }
        .perna-traseira-esq {
            animation: pernaFrente 0.3s ease-in-out infinite alternate-reverse;
            transform-origin: top center;
        }
        .perna-traseira-dir {
            animation: pernaFrente 0.3s ease-in-out infinite alternate;
            transform-origin: top center;
        }

        @keyframes pernaFrente {
            0% { transform: rotate(-10deg); }
            100% { transform: rotate(10deg); }
        }

        /* Cauda animada */
        .cauda {
            animation: caudaMexe 1s ease-in-out infinite alternate;
            transform-origin: right center;
        }

        @keyframes caudaMexe {
            0% { transform: rotate(-15deg); }
            100% { transform: rotate(15deg); }
        }

        /* Buquê animado */
        .buque {
            animation: buqueAgita 0.5s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }

        @keyframes buqueAgita {
            0% { transform: rotate(-10deg) translateY(-3px); }
            100% { transform: rotate(10deg) translateY(3px); }
        }

        /* Olhos piscando */
        .olho {
            animation: pisca 3s ease-in-out infinite;
        }

        @keyframes pisca {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        /* Coração saindo da pantera */
        .coracao-pantera {
            position: absolute;
            font-size: 20px;
            animation: sobeCora 1.5s ease-out infinite;
            opacity: 0;
        }

        @keyframes sobeCora {
            0% { 
                transform: translateY(0) scale(0.5); 
                opacity: 0;
            }
            20% { 
                opacity: 1;
            }
            100% { 
                transform: translateY(-60px) scale(1.2); 
                opacity: 0;
            }
        }

        /* Estrelas piscando */
        .estrela {
            position: absolute;
            font-size: 16px;
            animation: piscaEstrela 1s ease-in-out infinite;
        }

        @keyframes piscaEstrela {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="container" id="pergunta">
        <div class="coracoes">💕💕💕</div>
        <h1>Myrella, quer ser minha?</h1>
        <div class="botoes">
            <button class="btn btn-sim" onclick="responderSim()">Sim 💕</button>
            <button class="btn btn-nao" id="btnNao" onmouseenter="fugir()" onclick="fugir()">Não 😢</button>
        </div>
    </div>

    <div class="sucesso" id="sucesso">
        <div class="coracoes-grandes">❤️💕❤️</div>
        <h2>EU SABIA! 💕</h2>
        <p style="color: white; font-size: 24px; margin-top: 20px;">Agora somos oficialmente um casal!</p>
        
        <!-- Pantera Cor de Rosa animada com buquê -->
        <div class="pantera-container">
            <!-- Estrelas ao redor -->
            <div class="estrela" style="top: 10px; left: 20px; animation-delay: 0s;">✨</div>
            <div class="estrela" style="top: 30px; right: 30px; animation-delay: 0.3s;">✨</div>
            <div class="estrela" style="bottom: 40px; left: 10px; animation-delay: 0.6s;">✨</div>
            <div class="estrela" style="bottom: 20px; right: 20px; animation-delay: 0.9s;">✨</div>
            
            <!-- Corações saindo da pantera -->
            <div class="coracao-pantera" style="left: 80px; top: 20px; animation-delay: 0s;">💕</div>
            <div class="coracao-pantera" style="left: 120px; top: 10px; animation-delay: 0.5s;">💗</div>
            <div class="coracao-pantera" style="left: 160px; top: 25px; animation-delay: 1s;">💖</div>
            
            <div class="pantera">
                <svg viewBox="0 0 220 200" width="220" height="200">
                    <!-- Cauda -->
                    <g class="cauda">
                        <path d="M 35 120 Q 10 100 15 130 Q 20 155 40 140" stroke="#ff69b4" stroke-width="10" fill="none" stroke-linecap="round"/>
                    </g>
                    
                    <!-- Corpo -->
                    <ellipse cx="100" cy="120" rx="55" ry="40" fill="#ff69b4"/>
                    <ellipse cx="100" cy="120" rx="55" ry="40" fill="url(#gradPantera)"/>
                    
                    <!-- Barriga clara -->
                    <ellipse cx="100" cy="125" rx="35" ry="25" fill="#ffb6c1"/>
                    
                    <!-- Pernas traseiras -->
                    <g class="perna-traseira-esq">
                        <ellipse cx="55" cy="155" rx="15" ry="12" fill="#ff69b4"/>
                        <ellipse cx="55" cy="160" rx="12" ry="8" fill="#ffb6c1"/>
                    </g>
                    <g class="perna-traseira-dir">
                        <ellipse cx="145" cy="155" rx="15" ry="12" fill="#ff69b4"/>
                        <ellipse cx="145" cy="160" rx="12" ry="8" fill="#ffb6c1"/>
                    </g>
                    
                    <!-- Pernas dianteiras -->
                    <g class="perna-dianteira-esq">
                        <ellipse cx="70" cy="158" rx="14" ry="10" fill="#ff69b4"/>
                        <ellipse cx="70" cy="163" rx="11" ry="7" fill="#ffb6c1"/>
                    </g>
                    <g class="perna-dianteira-dir">
                        <ellipse cx="130" cy="158" rx="14" ry="10" fill="#ff69b4"/>
                        <ellipse cx="130" cy="163" rx="11" ry="7" fill="#ffb6c1"/>
                    </g>
                    
                    <!-- Pes -->
                    <ellipse cx="55" cy="168" rx="10" ry="6" fill="#ff69b4"/>
                    <ellipse cx="70" cy="171" rx="10" ry="6" fill="#ff69b4"/>
                    <ellipse cx="130" cy="171" rx="10" ry="6" fill="#ff69b4"/>
                    <ellipse cx="145" cy="168" rx="10" ry="6" fill="#ff69b4"/>
                    
                    <!-- Listras -->
                    <path d="M 70 105 Q 80 115 70 125" stroke="#d4508a" stroke-width="3" fill="none"/>
                    <path d="M 90 100 Q 100 110 90 120" stroke="#d4508a" stroke-width="3" fill="none"/>
                    <path d="M 110 100 Q 120 110 110 120" stroke="#d4508a" stroke-width="3" fill="none"/>
                    <path d="M 130 105 Q 140 115 130 125" stroke="#d4508a" stroke-width="3" fill="none"/>
                    
                    <!-- Cabeça -->
                    <ellipse cx="170" cy="80" rx="30" ry="28" fill="#ff69b4"/>
                    
                    <!-- Focinho -->
                    <ellipse cx="180" cy="88" rx="15" ry="12" fill="#ffb6c1"/>
                    
                    <!-- Orelhas -->
                    <ellipse cx="155" cy="55" rx="10" ry="15" fill="#ff69b4"/>
                    <ellipse cx="185" cy="55" rx="10" ry="15" fill="#ff69b4"/>
                    <ellipse cx="155" cy="55" rx="6" ry="10" fill="#ffb6c1"/>
                    <ellipse cx="185" cy="55" rx="6" ry="10" fill="#ffb6c1"/>
                    
                    <!-- Olhos -->
                    <g class="olho">
                        <ellipse cx="162" cy="78" rx="7" ry="8" fill="white"/>
                        <ellipse cx="178" cy="78" rx="7" ry="8" fill="white"/>
                        <circle cx="164" cy="79" r="4" fill="#333"/>
                        <circle cx="180" cy="79" r="4" fill="#333"/>
                        <circle cx="165" cy="77" r="1.5" fill="white"/>
                        <circle cx="181" cy="77" r="1.5" fill="white"/>
                    </g>
                    
                    <!-- Nariz -->
                    <ellipse cx="190" cy="85" rx="5" ry="4" fill="#333"/>
                    
                    <!-- Boca sorrindo -->
                    <path d="M 178 95 Q 185 105 192 95" stroke="#333" stroke-width="2" fill="none"/>
                    
                    <!-- Bigodes -->
                    <line x1="145" y1="85" x2="130" y2="80" stroke="#333" stroke-width="1.5"/>
                    <line x1="145" y1="90" x2="128" y2="92" stroke="#333" stroke-width="1.5"/>
                    <line x1="145" y1="95" x2="130" y2="100" stroke="#333" stroke-width="1.5"/>
                    <line x1="195" y1="85" x2="210" y2="80" stroke="#333" stroke-width="1.5"/>
                    <line x1="195" y1="90" x2="212" y2="92" stroke="#333" stroke-width="1.5"/>
                    <line x1="195" y1="95" x2="210" y2="100" stroke="#333" stroke-width="1.5"/>
                    
                    <!-- Buquê de rosas (pata da frente) -->
                    <g class="buque">
                        <!-- Mãos segurando -->
                        <ellipse cx="145" cy="140" rx="8" ry="6" fill="#ff69b4"/>
                        
                        <!-- Caules -->
                        <line x1="145" y1="135" x2="155" y2="70" stroke="#228B22" stroke-width="4"/>
                        <line x1="145" y1="135" x2="170" y2="65" stroke="#228B22" stroke-width="4"/>
                        <line x1="145" y1="135" x2="185" y2="75" stroke="#228B22" stroke-width="4"/>
                        
                        <!-- Rosas grandes e bonitas -->
                        <g>
                            <!-- Rosa 1 -->
                            <circle cx="155" cy="62" r="12" fill="#ff1493"/>
                            <circle cx="155" cy="62" r="8" fill="#ff69b4"/>
                            <circle cx="155" cy="62" r="4" fill="#ffb6c1"/>
                            <path d="M 148 58 Q 155 52 162 58" stroke="#ff1493" stroke-width="2" fill="none"/>
                            <path d="M 148 65 Q 155 72 162 65" stroke="#ff1493" stroke-width="2" fill="none"/>
                            
                            <!-- Rosa 2 -->
                            <circle cx="170" cy="55" r="12" fill="#ff1493"/>
                            <circle cx="170" cy="55" r="8" fill="#ff69b4"/>
                            <circle cx="170" cy="55" r="4" fill="#ffb6c1"/>
                            <path d="M 163 51 Q 170 45 177 51" stroke="#ff1493" stroke-width="2" fill="none"/>
                            <path d="M 163 58 Q 170 65 177 58" stroke="#ff1493" stroke-width="2" fill="none"/>
                            
                            <!-- Rosa 3 -->
                            <circle cx="185" cy="68" r="12" fill="#ff1493"/>
                            <circle cx="185" cy="68" r="8" fill="#ff69b4"/>
                            <circle cx="185" cy="68" r="4" fill="#ffb6c1"/>
                            <path d="M 178 64 Q 185 58 192 64" stroke="#ff1493" stroke-width="2" fill="none"/>
                            <path d="M 178 71 Q 185 78 192 71" stroke="#ff1493" stroke-width="2" fill="none"/>
                        </g>
                        
                        <!-- Folhas -->
                        <ellipse cx="148" cy="80" rx="8" ry="4" fill="#228B22" transform="rotate(-40 148 80)"/>
                        <ellipse cx="165" cy="72" rx="8" ry="4" fill="#228B22" transform="rotate(25 165 72)"/>
                        <ellipse cx="180" cy="78" rx="8" ry="4" fill="#228B22" transform="rotate(-20 180 78)"/>
                    </g>
                    
                    <!-- Gradiente -->
                    <defs>
                        <linearGradient id="gradPantera" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#ff69b4;stop-opacity:0.3" />
                            <stop offset="100%" style="stop-color:#ff1493;stop-opacity:0.3" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
        </div>
        
        <div class="coracoes-grandes">💕💕💕</div>
    </div>

    <script>
        let cliqueCount = 0;
        const btnNao = document.getElementById('btnNao');

        function fugir() {
            cliqueCount++;
            
            const larguraTela = window.innerWidth;
            const alturaTela = window.innerHeight;
            
            const novaX = Math.random() * (larguraTela - 150);
            const novaY = Math.random() * (alturaTela - 60);
            
            btnNao.style.left = novaX + 'px';
            btnNao.style.top = novaY + 'px';
            btnNao.style.position = 'fixed';
            
            // Fica menor a cada clique
            const tamanho = Math.max(12, 22 - cliqueCount * 2);
            btnNao.style.fontSize = tamanho + 'px';
            btnNao.style.padding = (18 - cliqueCount) + 'px ' + (50 - cliqueCount * 3) + 'px';
            
            // Texto muda
            const textos = ['Não 😢', 'Ah não...', 'Por favor!', 'Não fui...', 'Tá bom 😭', 'Sem chance!', 'Esquece...'];
            btnNao.textContent = textos[Math.min(cliqueCount, textos.length - 1)];
        }

        function responderSim() {
            document.getElementById('pergunta').style.display = 'none';
            document.getElementById('sucesso').style.display = 'block';
            criarCoracoes();
        }

        function criarCoracoes() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = ['❤️', '💕', '💗', '💖', '💘'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.top = '-50px';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.body.appendChild(heart);
            
            setTimeout(() => heart.remove(), 5000);
        }

        // Criar corações caindo periodicamente
        setInterval(criarCoracoes, 300);

        // Mover botão com mouse
        document.addEventListener('mousemove', (e) => {
            const btnRect = btnNao.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;
            
            const distX = e.clientX - btnCenterX;
            const distY = e.clientY - btnCenterY;
            const distancia = Math.sqrt(distX * distX + distY * distY);
            
            if (distancia < 150 && btnNao.style.position === 'fixed') {
                fugir();
            }
        });
    </script>
</body>
</html>
