<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Myrella</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #e94560;
            font-size: 42px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 8px rgba(233, 69, 96, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .coracoes {
            font-size: 40px;
            margin-bottom: 30px;
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .botoes {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn {
            padding: 18px 50px;
            font-size: 22px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-sim {
            background: #e94560;
            color: white;
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.5);
        }

        .btn-sim:hover {
            background: #ff6b81;
            transform: scale(1.1);
        }

        .btn-nao {
            background: #533483;
            color: white;
            box-shadow: 0 8px 25px rgba(83, 52, 131, 0.5);
            position: relative;
        }

        .btn-nao:hover {
            background: #6c44a2;
        }

        /* Tela de sucesso */
        .sucesso {
            display: none;
            text-align: center;
        }

        .sucesso h2 {
            color: #e94560;
            font-size: 48px;
            margin-bottom: 20px;
            animation: bounce 0.5s ease-in-out infinite alternate;
        }

        @keyframes bounce {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .sucesso .coracoes-grandes {
            font-size: 80px;
            animation: float 1s infinite ease-in-out;
        }

        /* Corações caindo */
        .heart {
            position: fixed;
            font-size: 24px;
            animation: fall linear forwards;
            pointer-events: none;
            z-index: 999;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Caveira container */
        .caveira-container {
            margin: 30px auto;
            position: relative;
            width: 300px;
            height: 280px;
        }

        .caveira-svg {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Animações dos ossos */
        .osso {
            position: absolute;
            opacity: 0;
        }

        .osso.montando {
            animation: ossoVem 1s ease-out forwards;
        }

        @keyframes ossoVem {
            0% {
                opacity: 0;
                transform: translate(var(--start-x), var(--start-y)) rotate(var(--start-rot));
            }
            100% {
                opacity: 1;
                transform: translate(0, 0) rotate(0deg);
            }
        }

        .caveira-montada {
            animation: respira 2s ease-in-out infinite;
        }

        @keyframes respira {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Rosa na mão */
        .rosa-mao {
            opacity: 0;
            animation: rosaAparece 0.5s ease-out forwards;
        }

        @keyframes rosaAparece {
            0% { opacity: 0; transform: scale(0) rotate(-180deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        /* Olhos brilhando */
        .olho-brilho {
            animation: brilho 1.5s ease-in-out infinite alternate;
        }

        @keyframes brilho {
            0% { filter: drop-shadow(0 0 3px #e94560); }
            100% { filter: drop-shadow(0 0 15px #e94560); }
        }

        /* Corações saindo da caveira */
        .coracao-caveira {
            position: absolute;
            font-size: 18px;
            animation: sobeCora 2s ease-out infinite;
            opacity: 0;
        }

        @keyframes sobeCora {
            0% { 
                transform: translateY(0) scale(0.5); 
                opacity: 0;
            }
            20% { 
                opacity: 1;
            }
            100% { 
                transform: translateY(-80px) scale(1.2) rotate(20deg); 
                opacity: 0;
            }
        }

        /* Estrelas */
        .estrela {
            position: absolute;
            font-size: 14px;
            animation: piscaEstrela 1s ease-in-out infinite;
        }

        @keyframes piscaEstrela {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Ossos espalhados (antes de montar) */
        .ossos-espalhados {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .osso-solto {
            position: absolute;
            animation: flutua 2s ease-in-out infinite;
        }

        @keyframes flutua {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
    </style>
</head>
<body>
    <div class="container" id="pergunta">
        <div class="coracoes">💀💕💀</div>
        <h1>Myrella, quer ser minha?</h1>
        <div class="botoes">
            <button class="btn btn-sim" onclick="responderSim()">Sim 💕</button>
            <button class="btn btn-nao" id="btnNao" onmouseenter="fugir()" onclick="fugir()">Não 😢</button>
        </div>
    </div>

    <div class="sucesso" id="sucesso">
        <div class="coracoes-grandes">💀❤️💀</div>
        <h2>EU SABIA! 💕</h2>
        <p style="color: #e94560; font-size: 24px; margin-top: 20px;">Agora somos oficialmente um casal!</p>
        
        <!-- Caveira montando ossos -->
        <div class="caveira-container">
            <!-- Corações saindo -->
            <div class="coracao-caveira" style="left: 100px; top: 30px; animation-delay: 0s;">💕</div>
            <div class="coracao-caveira" style="left: 150px; top: 20px; animation-delay: 0.7s;">💗</div>
            <div class="coracao-caveira" style="left: 200px; top: 35px; animation-delay: 1.4s;">💖</div>
            
            <!-- Estrelas -->
            <div class="estrela" style="top: 5px; left: 30px; animation-delay: 0s;">✨</div>
            <div class="estrela" style="top: 20px; right: 40px; animation-delay: 0.4s;">✨</div>
            <div class="estrela" style="bottom: 50px; left: 20px; animation-delay: 0.8s;">✨</div>
            <div class="estrela" style="bottom: 30px; right: 30px; animation-delay: 1.2s;">✨</div>
            
            <!-- Ossos soltos (desaparecem quando monta) -->
            <div class="ossos-espalhados" id="ossosEspalhados">
                <div class="osso-solto" style="top: 20px; left: 20px; animation-delay: 0s;">🦴</div>
                <div class="osso-solto" style="top: 60px; right: 30px; animation-delay: 0.3s;">🦴</div>
                <div class="osso-solto" style="bottom: 80px; left: 40px; animation-delay: 0.6s;">🦴</div>
                <div class="osso-solto" style="bottom: 40px; right: 50px; animation-delay: 0.9s;">🦴</div>
                <div class="osso-solto" style="top: 100px; left: 10px; animation-delay: 0.2s;">💀</div>
            </div>
            
            <!-- Caveira montada -->
            <div class="caveira-montada" id="caveiraMontada" style="display: none;">
                <svg viewBox="0 0 200 250" width="200" height="250">
                    <!-- Crânio -->
                    <ellipse cx="100" cy="50" rx="45" ry="40" fill="#f5f5dc"/>
                    <ellipse cx="100" cy="50" rx="45" ry="40" fill="url(#gradCaveira)"/>
                    
                    <!-- Testa -->
                    <path d="M 55 40 Q 100 20 145 40" stroke="#d4d4aa" stroke-width="2" fill="none"/>
                    
                    <!-- Olhos -->
                    <g class="olho-brilho">
                        <ellipse cx="80" cy="50" rx="12" ry="14" fill="#1a1a2e"/>
                        <ellipse cx="120" cy="50" rx="12" ry="14" fill="#1a1a2e"/>
                        <circle cx="80" cy="50" r="4" fill="#e94560"/>
                        <circle cx="120" cy="50" r="4" fill="#e94560"/>
                    </g>
                    
                    <!-- Nariz -->
                    <path d="M 95 65 L 100 75 L 105 65" stroke="#d4d4aa" stroke-width="2" fill="none"/>
                    
                    <!-- Boca sorrindo -->
                    <path d="M 75 80 Q 100 100 125 80" stroke="#d4d4aa" stroke-width="3" fill="none"/>
                    <line x1="82" y1="83" x2="82" y2="90" stroke="#d4d4aa" stroke-width="2"/>
                    <line x1="90" y1="87" x2="90" y2="95" stroke="#d4d4aa" stroke-width="2"/>
                    <line x1="100" y1="89" x2="100" y2="98" stroke="#d4d4aa" stroke-width="2"/>
                    <line x1="110" y1="87" x2="110" y2="95" stroke="#d4d4aa" stroke-width="2"/>
                    <line x1="118" y1="83" x2="118" y2="90" stroke="#d4d4aa" stroke-width="2"/>
                    
                    <!-- Mandíbula -->
                    <path d="M 60 70 Q 100 120 140 70" stroke="#d4d4aa" stroke-width="2" fill="#f5f5dc"/>
                    
                    <!-- Coluna vertebral -->
                    <rect x="95" y="90" width="10" height="50" fill="#f5f5dc" rx="3"/>
                    <rect x="97" y="95" width="6" height="8" fill="#d4d4aa"/>
                    <rect x="97" y="108" width="6" height="8" fill="#d4d4aa"/>
                    <rect x="97" y="121" width="6" height="8" fill="#d4d4aa"/>
                    
                    <!-- Costelas -->
                    <path d="M 95 100 Q 60 105 55 115" stroke="#f5f5dc" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M 105 100 Q 140 105 145 115" stroke="#f5f5dc" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M 95 112 Q 65 117 60 127" stroke="#f5f5dc" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M 105 112 Q 135 117 140 127" stroke="#f5f5dc" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M 95 124 Q 70 129 65 139" stroke="#f5f5dc" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M 105 124 Q 130 129 135 139" stroke="#f5f5dc" stroke-width="4" fill="none" stroke-linecap="round"/>
                    
                    <!-- Braço esquerdo -->
                    <line x1="55" y1="115" x2="30" y2="160" stroke="#f5f5dc" stroke-width="5" stroke-linecap="round"/>
                    <line x1="30" y1="160" x2="25" y2="190" stroke="#f5f5dc" stroke-width="5" stroke-linecap="round"/>
                    <circle cx="25" cy="195" r="6" fill="#f5f5dc"/>
                    
                    <!-- Braço direito (segurando a rosa) -->
                    <line x1="145" y1="115" x2="170" y2="160" stroke="#f5f5dc" stroke-width="5" stroke-linecap="round"/>
                    <line x1="170" y1="160" x2="175" y2="190" stroke="#f5f5dc" stroke-width="5" stroke-linecap="round"/>
                    
                    <!-- Mão com rosa -->
                    <g class="rosa-mao" id="rosaMao">
                        <circle cx="175" cy="195" r="6" fill="#f5f5dc"/>
                        <!-- Rosa -->
                        <line x1="175" y1="195" x2="185" y2="150" stroke="#228B22" stroke-width="3"/>
                        <circle cx="185" cy="142" r="12" fill="#e94560"/>
                        <circle cx="185" cy="142" r="8" fill="#ff6b81"/>
                        <circle cx="185" cy="142" r="4" fill="#ffb6c1"/>
                        <path d="M 178 138 Q 185 130 192 138" stroke="#e94560" stroke-width="2" fill="none"/>
                        <path d="M 178 146 Q 185 155 192 146" stroke="#e94560" stroke-width="2" fill="none"/>
                        <!-- Folhas -->
                        <ellipse cx="180" cy="160" rx="6" ry="3" fill="#228B22" transform="rotate(-30 180 160)"/>
                        <ellipse cx="188" cy="155" rx="6" ry="3" fill="#228B22" transform="rotate(30 188 155)"/>
                    </g>
                    
                    <!-- Pernas -->
                    <line x1="85" y1="140" x2="75" y2="200" stroke="#f5f5dc" stroke-width="5" stroke-linecap="round"/>
                    <line x1="75" y1="200" x2="70" y2="230" stroke="#f5f5dc" stroke-width="5" stroke-linecap="round"/>
                    <ellipse cx="70" cy="235" rx="10" ry="6" fill="#f5f5dc"/>
                    
                    <line x1="115" y1="140" x2="125" y2="200" stroke="#f5f5dc" stroke-width="5" stroke-linecap="round"/>
                    <line x1="125" y1="200" x2="130" y2="230" stroke="#f5f5dc" stroke-width="5" stroke-linecap="round"/>
                    <ellipse cx="130" cy="235" rx="10" ry="6" fill="#f5f5dc"/>
                    
                    <!-- Gradiente -->
                    <defs>
                        <linearGradient id="gradCaveira" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#f5f5dc;stop-opacity:0.5" />
                            <stop offset="100%" style="stop-color:#d4d4aa;stop-opacity:0.5" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
        </div>
        
        <div class="coracoes-grandes">💀💕💀</div>
    </div>

    <script>
        let cliqueCount = 0;
        const btnNao = document.getElementById('btnNao');

        function fugir() {
            cliqueCount++;
            
            const larguraTela = window.innerWidth;
            const alturaTela = window.innerHeight;
            
            const novaX = Math.random() * (larguraTela - 200);
            const novaY = Math.random() * (alturaTela - 80);
            
            btnNao.style.left = novaX + 'px';
            btnNao.style.top = novaY + 'px';
            btnNao.style.position = 'fixed';
            
            // NÃO muda o tamanho - sempre igual
            btnNao.style.fontSize = '22px';
            btnNao.style.padding = '18px 50px';
            
            // Texto muda
            const textos = ['Não 😢', 'Ah não...', 'Por favor!', 'Não fui...', 'Tá bom 😭', 'Sem chance!', 'Esquece...'];
            btnNao.textContent = textos[Math.min(cliqueCount, textos.length - 1)];
        }

        function responderSim() {
            document.getElementById('pergunta').style.display = 'none';
            document.getElementById('sucesso').style.display = 'block';
            montarCaveira();
            criarCoracoes();
        }

        function montarCaveira() {
            const espalhados = document.getElementById('ossosEspalhados');
            const montada = document.getElementById('caveiraMontada');
            const rosa = document.getElementById('rosaMao');
            
            // Espera um pouco e começa a montar
            setTimeout(() => {
                espalhados.style.transition = 'opacity 0.5s';
                espalhados.style.opacity = '0';
                
                setTimeout(() => {
                    espalhados.style.display = 'none';
                    montada.style.display = 'block';
                    
                    // Rosa aparece depois de um tempo
                    setTimeout(() => {
                        rosa.style.opacity = '1';
                    }, 1500);
                }, 500);
            }, 1000);
        }

        function criarCoracoes() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = ['💀', '💕', '💗', '💀', '🦴'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.top = '-50px';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.body.appendChild(heart);
            
            setTimeout(() => heart.remove(), 5000);
        }

        // Criar corações caindo periodicamente
        setInterval(criarCoracoes, 400);

        // Mover botão com mouse
        document.addEventListener('mousemove', (e) => {
            if (btnNao.style.position !== 'fixed') return;
            
            const btnRect = btnNao.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;
            
            const distX = e.clientX - btnCenterX;
            const distY = e.clientY - btnCenterY;
            const distancia = Math.sqrt(distX * distX + distY * distY);
            
            if (distancia < 120) {
                fugir();
            }
        });
    </script>
</body>
</html>
