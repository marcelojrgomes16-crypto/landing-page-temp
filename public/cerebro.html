<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cérebro Digital</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a12;overflow:hidden;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#00e5ff}
  #cerebro-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
  .title{position:fixed;top:20px;width:100%;text-align:center;z-index:10;pointer-events:none}
  .title h1{font-size:2.2rem;letter-spacing:6px;text-transform:uppercase;color:#00e5ff;text-shadow:0 0 20px #00e5ff,0 0 40px #00e5ff,0 0 80px #0080ff;font-weight:300}
  .title p{font-size:.85rem;color:#00e5ff88;margin-top:6px;letter-spacing:3px}
  .status-bar{position:fixed;bottom:0;left:0;width:100%;z-index:10;background:linear-gradient(180deg,transparent,#0a0a12ee);padding:14px 30px;display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:#00e5ff99;border-top:1px solid #00e5ff15}
  .status-bar .status-dot{width:8px;height:8px;border-radius:50%;background:#00e5ff;box-shadow:0 0 8px #00e5ff;display:inline-block;margin-right:6px;animation:pulse-dot 2s infinite}
  @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
  .tooltip{position:fixed;z-index:100;background:rgba(0,20,40,.92);border:1px solid #00e5ff55;border-radius:10px;padding:14px 18px;pointer-events:none;opacity:0;transition:opacity .2s;backdrop-filter:blur(10px);max-width:280px;box-shadow:0 0 30px #00e5ff22}
  .tooltip h3{font-size:1rem;color:#00e5ff;margin-bottom:4px;font-weight:500}
  .tooltip p{font-size:.78rem;color:#00e5ffaa;line-height:1.4}
  .tooltip a{color:#00e5ff;text-decoration:underline;font-size:.72rem}
</style>
</head>
<body>
<div class="title">
  <h1>Cérebro Digital</h1>
  <p>SISTEMA INTEGRADO DE PROJETOS</p>
</div>
<canvas id="cerebro-canvas"></canvas>
<div class="tooltip" id="tooltip">
  <h3 id="tt-title"></h3>
  <p id="tt-desc"></p>
  <a id="tt-link" href="#" target="_blank">Acessar projeto</a>
</div>
<div class="status-bar">
  <div><span class="status-dot"></span>SISTEMA ONLINE — TODOS OS MÓDULOS OPERACIONAIS</div>
  <div id="clock"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const W=()=>window.innerWidth, H=()=>window.innerHeight;
  const canvas=document.getElementById('cerebro-canvas');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setSize(W(),H());
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setClearColor(0x0a0a12,1);

  const scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x0a0a12,0.035);

  const camera=new THREE.PerspectiveCamera(50,W()/H(),0.1,1000);
  camera.position.set(0,0,18);

  const ambientLight=new THREE.AmbientLight(0x00e5ff,0.15);
  scene.add(ambientLight);
  const pointLight=new THREE.PointLight(0x00e5ff,1.2,50);
  pointLight.position.set(0,5,10);
  scene.add(pointLight);
  const pointLight2=new THREE.PointLight(0x0080ff,0.8,40);
  pointLight2.position.set(-8,-3,5);
  scene.add(pointLight2);

  // --- BRAIN CONSTRUCTION ---
  const brainGroup=new THREE.Group();
  scene.add(brainGroup);

  function createBrainHemisphere(side){
    const group=new THREE.Group();
    const sign=side==='left'?-1:1;

    const wireMat=new THREE.MeshPhongMaterial({
      color:0x00e5ff,
      emissive:0x003344,
      wireframe:true,
      transparent:true,
      opacity:0.35,
      shininess:80
    });
    const glowMat=new THREE.MeshPhongMaterial({
      color:0x00e5ff,
      emissive:0x00e5ff,
      transparent:true,
      opacity:0.08,
      side:THREE.DoubleSide
    });
    const outerGlow=new THREE.MeshPhongMaterial({
      color:0x00e5ff,
      emissive:0x00e5ff,
      transparent:true,
      opacity:0.04,
      side:THREE.BackSide
    });

    // Main hemisphere - use scaled sphere
    const mainGeo=new THREE.SphereGeometry(3.2,32,24);
    const mainMesh=new THREE.Mesh(mainGeo,wireMat);
    mainMesh.scale.set(1,0.85,1.15);
    mainMesh.position.x=sign*1.6;
    group.add(mainMesh);

    // Outer glow shell
    const shellGeo=new THREE.SphereGeometry(3.5,20,16);
    const shellMesh=new THREE.Mesh(shellGeo,outerGlow);
    shellMesh.scale.set(1,0.85,1.15);
    shellMesh.position.x=sign*1.6;
    group.add(shellMesh);

    // Frontal lobe bump
    const frontGeo=new THREE.SphereGeometry(2.2,20,16);
    const frontMesh=new THREE.Mesh(frontGeo,wireMat);
    frontMesh.scale.set(1,0.9,0.9);
    frontMesh.position.set(sign*0.9,0.6,2.0);
    group.add(frontMesh);

    // Frontal glow
    const frontGlow=new THREE.Mesh(frontGeo.clone(),glowMat);
    frontGlow.scale.copy(frontMesh.scale);
    frontGlow.position.copy(frontMesh.position);
    group.add(frontGlow);

    // Temporal lobe
    const tempGeo=new THREE.SphereGeometry(1.8,16,12);
    const tempMesh=new THREE.Mesh(tempGeo,wireMat);
    tempMesh.scale.set(1.1,0.7,1.0);
    tempMesh.position.set(sign*2.8,-0.8,0.3);
    group.add(tempMesh);

    // Parietal lobe
    const parGeo=new THREE.SphereGeometry(2.0,16,12);
    const parMesh=new THREE.Mesh(parGeo,wireMat);
    parMesh.scale.set(0.9,0.8,1.0);
    parMesh.position.set(sign*1.2,1.8,-0.8);
    group.add(parMesh);

    // Occipital lobe
    const occGeo=new THREE.SphereGeometry(1.6,16,12);
    const occMesh=new THREE.Mesh(occGeo,wireMat);
    occMesh.scale.set(0.8,0.85,1.0);
    occMesh.position.set(sign*1.0,0.4,-2.8);
    group.add(occMesh);

    // Cerebellum
    const cerGeo=new THREE.SphereGeometry(1.3,16,12);
    const cerMesh=new THREE.Mesh(cerGeo,wireMat);
    cerMesh.scale.set(0.9,0.8,0.8);
    cerMesh.position.set(sign*0.6,-2.2,-2.0);
    group.add(cerMesh);

    // Surface detail bumps
    for(let i=0;i<35;i++){
      const r=0.2+Math.random()*0.5;
      const bumpGeo=new THREE.SphereGeometry(r,8,6);
      const bumpMat=new THREE.MeshPhongMaterial({
        color:0x00e5ff,
        emissive:0x002233,
        wireframe:true,
        transparent:true,
        opacity:0.2+Math.random()*0.2
      });
      const bump=new THREE.Mesh(bumpGeo,bumpMat);
      const theta=Math.random()*Math.PI;
      const phi=Math.random()*Math.PI*2;
      const rad=2.8+Math.random()*0.6;
      bump.position.set(
        sign*1.6+rad*Math.sin(theta)*Math.cos(phi)*0.7,
        rad*Math.cos(theta)*0.85,
        rad*Math.sin(theta)*Math.sin(phi)*1.15
      );
      group.add(bump);
    }

    // Sulci lines (brain folds)
    const lineMat=new THREE.LineBasicMaterial({color:0x00e5ff,transparent:true,opacity:0.5});
    for(let i=0;i<12;i++){
      const pts=[];
      const startTheta=Math.random()*Math.PI;
      const startPhi=Math.random()*Math.PI*2;
      for(let j=0;j<15;j++){
        const t=j/14;
        const theta=startTheta+t*1.2-0.6;
        const phi=startPhi+Math.sin(t*Math.PI)*0.8;
        const r=3.0+Math.sin(t*Math.PI)*0.3;
        pts.push(new THREE.Vector3(
          sign*1.6+r*Math.sin(theta)*Math.cos(phi)*0.7,
          r*Math.cos(theta)*0.85,
          r*Math.sin(theta)*Math.sin(phi)*1.15
        ));
      }
      const curve=new THREE.CatmullRomCurve3(pts);
      const geo=new THREE.TubeGeometry(curve,20,0.02,4,false);
      const line=new THREE.Line(geo,lineMat);
      group.add(line);
    }

    // Internal structure lines
    const intMat=new THREE.LineBasicMaterial({color:0x0080ff,transparent:true,opacity:0.25});
    for(let i=0;i<8;i++){
      const pts=[];
      for(let j=0;j<10;j++){
        const t=j/9;
        pts.push(new THREE.Vector3(
          sign*(0.5+t*2.5),
          (Math.random()-0.5)*3,
          (Math.random()-0.5)*3
        ));
      }
      const curve=new THREE.CatmullRomCurve3(pts);
      const geo=new THREE.TubeGeometry(curve,15,0.015,4,false);
      const line=new THREE.Line(geo,intMat);
      group.add(line);
    }

    return group;
  }

  const leftHemi=createBrainHemisphere('left');
  const rightHemi=createBrainHemisphere('right');
  brainGroup.add(leftHemi);
  brainGroup.add(rightHemi);

  // Central gap line
  const gapMat=new THREE.LineBasicMaterial({color:0x00e5ff,transparent:true,opacity:0.4});
  for(let i=0;i<6;i++){
    const pts=[];
    for(let j=0;j<20;j++){
      const t=j/19;
      pts.push(new THREE.Vector3(
        0,
        (t-0.5)*5+Math.sin(t*Math.PI*3+i)*0.1,
        (t-0.5)*5
      ));
    }
    const curve=new THREE.CatmullRomCurve3(pts);
    const geo=new THREE.TubeGeometry(curve,20,0.01,4,false);
    brainGroup.add(new THREE.Line(geo,gapMat));
  }

  // --- NEURAL NETWORK LINES inside brain ---
  const neuralMat=new THREE.LineBasicMaterial({color:0x00e5ff,transparent:true,opacity:0.3});
  for(let i=0;i<40;i++){
    const pts=[];
    const sx=(Math.random()-0.5)*4;
    const sy=(Math.random()-0.5)*4;
    const sz=(Math.random()-0.5)*4;
    pts.push(new THREE.Vector3(sx,sy,sz));
    for(let j=1;j<6;j++){
      pts.push(new THREE.Vector3(
        sx+(Math.random()-0.5)*3,
        sy+(Math.random()-0.5)*3,
        sz+(Math.random()-0.5)*3
      ));
    }
    const curve=new THREE.CatmullRomCurve3(pts);
    const geo=new THREE.TubeGeometry(curve,15,0.008,4,false);
    brainGroup.add(new THREE.Line(geo,neuralMat));
  }

  // --- GLOWING NODES on brain surface ---
  const nodePositions=[];
  const nodesGroup=new THREE.Group();
  brainGroup.add(nodesGroup);

  for(let i=0;i<60;i++){
    const geo=new THREE.SphereGeometry(0.06+Math.random()*0.08,8,6);
    const mat=new THREE.MeshBasicMaterial({
      color:0x00e5ff,
      transparent:true,
      opacity:0.6+Math.random()*0.4
    });
    const node=new THREE.Mesh(geo,mat);
    const side=Math.random()>0.5?1:-1;
    const theta=Math.random()*Math.PI;
    const phi=Math.random()*Math.PI*2;
    const r=2.8+Math.random()*0.8;
    node.position.set(
      side*1.6+r*Math.sin(theta)*Math.cos(phi)*0.7,
      r*Math.cos(theta)*0.85,
      r*Math.sin(theta)*Math.sin(phi)*1.15
    );
    nodesGroup.add(node);
    nodePositions.push({mesh:node,baseOpacity:mat.opacity,phase:Math.random()*Math.PI*2});
  }

  // --- BACKGROUND STARS ---
  const starsGeo=new THREE.BufferGeometry();
  const starCount=1500;
  const starPositions=new Float32Array(starCount*3);
  const starColors=new Float32Array(starCount*3);
  for(let i=0;i<starCount;i++){
    starPositions[i*3]=(Math.random()-0.5)*100;
    starPositions[i*3+1]=(Math.random()-0.5)*100;
    starPositions[i*3+2]=(Math.random()-0.5)*100;
    const c=Math.random()>0.8?1:0.5+Math.random()*0.5;
    starColors[i*3]=0;c*0.2;
    starColors[i*3+1]=c*0.6;
    starColors[i*3+2]=c;
  }
  starsGeo.setAttribute('position',new THREE.BufferAttribute(starPositions,3));
  starsGeo.setAttribute('color',new THREE.BufferAttribute(starColors,3));
  const starsMat=new THREE.PointsMaterial({size:0.08,vertexColors:true,transparent:true,opacity:0.8});
  const stars=new THREE.Points(starsGeo,starsMat);
  scene.add(stars);

  // --- PROJECT NODES ---
  const projects=[
    {emoji:'🍷',name:'Adega To Chegando',desc:'Sistema de gestão para distribuidora de bebidas',url:'https://estoque-distribuidora-th3q.onrender.com/'},
    {emoji:'💕',name:'Para Myrella',desc:'Landing page dedicada',url:'https://landing-page-temp.onrender.com/'},
    {emoji:'🧬',name:'Biomedicina',desc:'Plataforma de biomedicina',url:'https://landing-page-temp.onrender.com/'},
    {emoji:'📦',name:'Controle de Estoque',desc:'Módulo de estoque e consumidor',url:'https://estoque-distribuidora-th3q.onrender.com/consumidor.html'},
    {emoji:'⚡',name:'API REST',desc:'Endpoint de saúde da API',url:'https://estoque-distribuidora-th3q.onrender.com/api/health'},
    {emoji:'🚀',name:'Deploy',desc:'Plataforma de deploy Render',url:'https://render.com'}
  ];

  const projectNodes=[];
  const projectGroup=new THREE.Group();
  scene.add(projectGroup);

  projects.forEach((proj,i)=>{
    const group=new THREE.Group();

    // Orbit ring
    const ringGeo=new THREE.RingGeometry(6.5,6.7,64);
    const ringMat=new THREE.MeshBasicMaterial({color:0x00e5ff,transparent:true,opacity:0.08,side:THREE.DoubleSide});
    // We'll position rings per node

    // Node sphere
    const sphereGeo=new THREE.SphereGeometry(0.3,16,12);
    const sphereMat=new THREE.MeshPhongMaterial({
      color:0x00e5ff,
      emissive:0x00e5ff,
      emissiveIntensity:0.5,
      transparent:true,
      opacity:0.8
    });
    const sphere=new THREE.Mesh(sphereGeo,sphereMat);
    group.add(sphere);

    // Outer glow
    const glowGeo=new THREE.SphereGeometry(0.5,12,8);
    const glowMat=new THREE.MeshBasicMaterial({color:0x00e5ff,transparent:true,opacity:0.15});
    const glow=new THREE.Mesh(glowGeo,glowMat);
    group.add(glow);

    // Ring around node
    const nodeRingGeo=new THREE.RingGeometry(0.45,0.48,32);
    const nodeRingMat=new THREE.MeshBasicMaterial({color:0x00e5ff,transparent:true,opacity:0.4,side:THREE.DoubleSide});
    const nodeRing=new THREE.Mesh(nodeRingGeo,nodeRingMat);
    group.add(nodeRing);

    // Connection line to brain center
    const lineMat=new THREE.LineBasicMaterial({color:0x00e5ff,transparent:true,opacity:0.2});
    const lineGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,0)]);
    const line=new THREE.Line(lineGeo,lineMat);
    scene.add(line);

    // Position in 3D orbit
    const angle=(i/projects.length)*Math.PI*2;
    const radius=7;
    const yOffset=(Math.random()-0.5)*4;
    const tilt=Math.random()*0.5;

    group.userData={proj,index:i,angle,radius,yOffset,tilt,line,sphere,glow};
    projectGroup.add(group);
    projectNodes.push(group);

    // Text sprite
    const labelCanvas=document.createElement('canvas');
    labelCanvas.width=512;
    labelCanvas.height=128;
    const ctx=labelCanvas.getContext('2d');
    ctx.fillStyle='transparent';
    ctx.fillRect(0,0,512,128);
    ctx.font='bold 48px Segoe UI, sans-serif';
    ctx.textAlign='center';
    ctx.fillStyle='#00e5ff';
    ctx.shadowColor='#00e5ff';
    ctx.shadowBlur=15;
    ctx.fillText(proj.emoji+' '+proj.name,256,70);
    const tex=new THREE.CanvasTexture(labelCanvas);
    const spriteMat=new THREE.SpriteMaterial({map:tex,transparent:true,opacity:0.9});
    const sprite=new THREE.Sprite(spriteMat);
    sprite.scale.set(4,1,1);
    sprite.position.y=0.8;
    group.add(sprite);
  });

  // --- MOUSE CONTROLS ---
  let isDragging=false;
  let prevMouse={x:0,y:0};
  let rotVel={x:0.002,y:0.005};
  let targetRot={x:0,y:0};
  let currentRot={x:0,y:0};

  canvas.addEventListener('mousedown',e=>{isDragging=true;prevMouse={x:e.clientX,y:e.clientY}});
  canvas.addEventListener('mousemove',e=>{
    if(isDragging){
      const dx=e.clientX-prevMouse.x;
      const dy=e.clientY-prevMouse.y;
      rotVel.y=dx*0.005;
      rotVel.x=dy*0.005;
      prevMouse={x:e.clientX,y:e.clientY};
    }
    // Hover detection
    checkHover(e);
  });
  canvas.addEventListener('mouseup',()=>{isDragging=false});
  canvas.addEventListener('mouseleave',()=>{isDragging=false;hideTooltip()});

  // Touch support
  canvas.addEventListener('touchstart',e=>{
    isDragging=true;
    prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};
  },{passive:true});
  canvas.addEventListener('touchmove',e=>{
    if(isDragging&&e.touches.length){
      const dx=e.touches[0].clientX-prevMouse.x;
      const dy=e.touches[0].clientY-prevMouse.y;
      rotVel.y=dx*0.005;
      rotVel.x=dy*0.005;
      prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};
    }
  },{passive:true});
  canvas.addEventListener('touchend',()=>{isDragging=false});

  // --- TOOLTIP ---
  const tooltip=document.getElementById('tooltip');
  const ttTitle=document.getElementById('tt-title');
  const ttDesc=document.getElementById('tt-desc');
  const ttLink=document.getElementById('tt-link');
  const raycaster=new THREE.Raycaster();
  const mouse=new THREE.Vector2();
  let hoveredNode=null;

  function checkHover(e){
    mouse.x=(e.clientX/W())*2-1;
    mouse.y=-(e.clientY/H())*2+1;
    raycaster.setFromCamera(mouse,camera);

    let closest=null;
    let closestDist=Infinity;

    projectNodes.forEach(node=>{
      const sphere=node.userData.sphere;
      const worldPos=new THREE.Vector3();
      sphere.getWorldPosition(worldPos);
      const dist=raycaster.ray.distanceToPoint(worldPos);
      if(dist<0.8&&dist<closestDist){
        closestDist=dist;
        closest=node;
      }
    });

    if(closest&&closest!==hoveredNode){
      hoveredNode=closest;
      const p=closest.userData.proj;
      ttTitle.textContent=p.emoji+' '+p.name;
      ttDesc.textContent=p.desc;
      ttLink.href=p.url;
      tooltip.style.opacity='1';
      tooltip.style.left=(e.clientX+15)+'px';
      tooltip.style.top=(e.clientY-10)+'px';
      closest.userData.sphere.material.emissiveIntensity=1;
      closest.userData.glow.material.opacity=0.35;
    }else if(closest){
      tooltip.style.left=(e.clientX+15)+'px';
      tooltip.style.top=(e.clientY-10)+'px';
    }else if(hoveredNode){
      hideTooltip();
    }
  }

  function hideTooltip(){
    tooltip.style.opacity='0';
    if(hoveredNode){
      hoveredNode.userData.sphere.material.emissiveIntensity=0.5;
      hoveredNode.userData.glow.material.opacity=0.15;
      hoveredNode=null;
    }
  }

  // --- CLOCK ---
  function updateClock(){
    const now=new Date();
    document.getElementById('clock').textContent=
      now.toLocaleTimeString('pt-BR')+' — '+now.toLocaleDateString('pt-BR');
  }
  setInterval(updateClock,1000);
  updateClock();

  // --- ANIMATION LOOP ---
  const clock=new THREE.Clock();

  function animate(){
    requestAnimationFrame(animate);
    const t=clock.getElapsedTime();
    const dt=clock.getDelta();

    // Rotation
    if(!isDragging){
      rotVel.x*=0.95;
      rotVel.y*=0.95;
      rotVel.y+=0.0003; // auto rotation
    }
    currentRot.x+=rotVel.x;
    currentRot.y+=rotVel.y;

    brainGroup.rotation.x=currentRot.x;
    brainGroup.rotation.y=currentRot.y;

    // Breathing effect on brain
    const breathe=1+Math.sin(t*0.8)*0.015;
    brainGroup.scale.set(breathe,breathe,breathe);

    // Pulse neural nodes
    nodePositions.forEach(n=>{
      n.mesh.material.opacity=n.baseOpacity*(0.5+0.5*Math.sin(t*2+n.phase));
      const s=1+Math.sin(t*3+n.phase)*0.3;
      n.mesh.scale.set(s,s,s);
    });

    // Animate project nodes in 3D orbits
    projectNodes.forEach((node,i)=>{
      const d=node.userData;
      const a=d.angle+t*0.15;
      const r=d.radius;
      const x=Math.cos(a)*r;
      const z=Math.sin(a)*r;
      const y=d.yOffset+Math.sin(t*0.5+i)*0.8;

      node.position.set(x,y,z);
      node.rotation.y=t*0.5;
      node.rotation.x=t*0.3;

      // Update connection line
      const lineGeo=new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0,0,0),
        new THREE.Vector3(x,y,z)
      ]);
      d.line.geometry.dispose();
      d.line.geometry=lineGeo;

      // Pulse glow
      d.glow.material.opacity=0.1+0.1*Math.sin(t*2+i);
      const gs=1+Math.sin(t*2+i)*0.2;
      d.glow.scale.set(gs,gs,gs);
    });

    // Stars subtle movement
    stars.rotation.y=t*0.01;
    stars.rotation.x=t*0.005;

    // Camera subtle float
    camera.position.x=Math.sin(t*0.1)*0.5;
    camera.position.y=Math.cos(t*0.15)*0.3;
    camera.lookAt(0,0,0);

    renderer.render(scene,camera);
  }

  animate();

  window.addEventListener('resize',()=>{
    camera.aspect=W()/H();
    camera.updateProjectionMatrix();
    renderer.setSize(W(),H());
  });
})();
</script>
</body>
</html>
