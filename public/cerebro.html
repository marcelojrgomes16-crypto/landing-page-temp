<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cérebro Digital</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:'Segoe UI',Tahoma,sans-serif;overflow:hidden;width:100vw;height:100vh}
#canvas-container{position:fixed;top:0;left:0;width:100%;height:100%}
.title{position:fixed;top:24px;left:50%;transform:translateX(-50%);font-size:2.4rem;font-weight:800;letter-spacing:4px;z-index:10;text-align:center;background:linear-gradient(90deg,#00e5ff,#00ff88,#00e5ff);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 3s ease-in-out infinite;text-shadow:0 0 40px rgba(0,229,255,.5)}
.title::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:200px;height:2px;background:linear-gradient(90deg,transparent,#00e5ff,transparent);animation:shimmer 3s ease-in-out infinite;background-size:200% 100%}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.status-bar{position:fixed;bottom:0;left:0;width:100%;height:44px;background:rgba(10,10,30,.85);backdrop-filter:blur(10px);border-top:1px solid rgba(0,229,255,.2);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:10;font-size:.8rem;color:rgba(0,229,255,.8)}
.status-dot{width:8px;height:8px;border-radius:50%;background:#00e5ff;box-shadow:0 0 8px #00e5ff;display:inline-block;margin-right:8px;animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:100;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal{background:linear-gradient(145deg,rgba(15,15,40,.98),rgba(10,10,25,.98));border:1px solid rgba(0,229,255,.3);border-radius:16px;padding:40px;max-width:480px;width:90%;text-align:center;box-shadow:0 0 60px rgba(0,229,255,.15),inset 0 0 30px rgba(0,229,255,.05);animation:modalIn .3s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.modal-icon{font-size:3rem;margin-bottom:16px}
.modal h2{font-size:1.5rem;margin-bottom:8px;color:#fff}
.modal p{color:rgba(255,255,255,.6);margin-bottom:24px;line-height:1.6}
.modal a{display:inline-block;padding:12px 36px;background:linear-gradient(135deg,#00e5ff,#0088ff);color:#fff;text-decoration:none;border-radius:30px;font-weight:700;font-size:1rem;transition:all .3s;box-shadow:0 0 20px rgba(0,229,255,.3)}
.modal a:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(0,229,255,.5)}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:rgba(255,255,255,.5);font-size:1.8rem;cursor:pointer;line-height:1}
.modal-close:hover{color:#fff}
.instructions{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:rgba(0,229,255,.4);font-size:.75rem;z-index:10;text-align:center;pointer-events:none}
</style>
</head>
<body>
<div id="canvas-container"></div>
<div class="title">CÉREBRO DIGITAL</div>
<div class="instructions">Arraste para girar • Clique nos nós para acessar</div>
<div class="status-bar">
  <div><span class="status-dot"></span>Sistema Online</div>
  <div id="clock"></div>
  <div>6 Projetos Ativos</div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" style="position:relative">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-icon" id="modalIcon"></div>
    <h2 id="modalTitle"></h2>
    <p id="modalDesc"></p>
    <a id="modalLink" href="#" target="_blank">Acessar</a>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const projects=[
  {name:"Adega To Chegando",icon:"🍷",desc:"Plataforma de estoque e distribuição de bebidas",url:"https://estoque-distribuidora-th3q.onrender.com/"},
  {name:"Para Myrella",icon:"💕",desc:"Landing page dedicada para Myrella",url:"https://landing-page-temp.onrender.com/"},
  {name:"Biomedicina",icon:"🧬",desc:"Projeto de Biomedicina e ciências da saúde",url:"https://landing-page-temp.onrender.com/"},
  {name:"Controle de Estoque",icon:"📦",desc:"Sistema completo de controle de estoque",url:"https://estoque-distribuidora-th3q.onrender.com/consumidor.html"},
  {name:"API REST",icon:"⚡",desc:"API RESTful com endpoints documentados",url:"https://estoque-distribuidora-th3q.onrender.com/api/health"},
  {name:"Deploy",icon:"🚀",desc:"Deploy contínuo via Render.com",url:"https://render.com"}
];

const container=document.getElementById("canvas-container");
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,.1,2000);
camera.position.set(0,0,30);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setClearColor(0x0a0a1a);
container.appendChild(renderer.domElement);

const ambientLight=new THREE.AmbientLight(0x222244,.5);
scene.add(ambientLight);
const pointLight1=new THREE.PointLight(0x00e5ff,2,100);
pointLight1.position.set(10,10,10);
scene.add(pointLight1);
const pointLight2=new THREE.PointLight(0xff4444,1,100);
pointLight2.position.set(-10,-10,5);
scene.add(pointLight2);
const pointLight3=new THREE.PointLight(0x00ff88,.8,80);
pointLight3.position.set(0,10,-10);
scene.add(pointLight3);

// Nucleus
const nucleusGroup=new THREE.Group();
scene.add(nucleusGroup);

function createNucleon(color,isNeutron){
  const geo=new THREE.SphereGeometry(isNeutron?.55:.5,16,16);
  const mat=new THREE.MeshStandardMaterial({
    color:color,
    emissive:color,
    emissiveIntensity:isNeutron?.2:.35,
    metalness:.8,
    roughness:.2,
    transparent:true,
    opacity:.9
  });
  const mesh=new THREE.Mesh(geo,mat);
  return mesh;
}

const protons=[];
const neutrons=[];
for(let i=0;i<8;i++){
  const p=createNucleon(0xff3333,false);
  const theta=Math.random()*Math.PI*2;
  const phi=Math.acos(2*Math.random()-1);
  const r=Math.random()*1.4;
  p.position.set(r*Math.sin(phi)*Math.cos(theta),r*Math.sin(phi)*Math.sin(theta),r*Math.cos(phi));
  nucleusGroup.add(p);
  protons.push(p);
}
for(let i=0;i<8;i++){
  const n=createNucleon(0x888899,true);
  const theta=Math.random()*Math.PI*2;
  const phi=Math.acos(2*Math.random()-1);
  const r=Math.random()*1.4;
  n.position.set(r*Math.sin(phi)*Math.cos(theta),r*Math.sin(phi)*Math.sin(theta),r*Math.cos(phi));
  nucleusGroup.add(n);
  neutrons.push(n);
}

// Nucleus glow
const glowGeo=new THREE.SphereGeometry(2.5,32,32);
const glowMat=new THREE.MeshBasicMaterial({color:0x00e5ff,transparent:true,opacity:.06});
const glowMesh=new THREE.Mesh(glowGeo,glowMat);
nucleusGroup.add(glowMesh);

const glowGeo2=new THREE.SphereGeometry(3.5,32,32);
const glowMat2=new THREE.MeshBasicMaterial({color:0x00e5ff,transparent:true,opacity:.03});
nucleusGroup.add(new THREE.Mesh(glowGeo2,glowMat2));

// Orbitals
const orbitals=[
  {tilt:0,speed:.3,color:0x00e5ff},
  {tilt:Math.PI/3,speed:.22,color:0x00ff88},
  {tilt:-Math.PI/3,speed:.35,color:0x4488ff},
  {tilt:Math.PI/2,speed:.18,color:0x00aaff}
];

const electronTrails=[];
const orbitalGroups=[];
const electronMeshes=[];

orbitals.forEach((orb,oi)=>{
  const orbGroup=new THREE.Group();
  orbGroup.rotation.x=orb.tilt;
  scene.add(orbGroup);
  orbitalGroups.push(orbGroup);

  // Orbit path ring
  const ringGeo=new THREE.TorusGeometry(8+oi*3,.03,8,128);
  const ringMat=new THREE.MeshBasicMaterial({color:orb.color,transparent:true,opacity:.15});
  const ring=new THREE.Mesh(ringGeo,ringMat);
  ring.rotation.x=Math.PI/2;
  orbGroup.add(ring);

  // Faint orbit ring glow
  const ringGlow=new THREE.Mesh(
    new THREE.TorusGeometry(8+oi*3,.15,8,128),
    new THREE.MeshBasicMaterial({color:orb.color,transparent:true,opacity:.04})
  );
  ringGlow.rotation.x=Math.PI/2;
  orbGroup.add(ringGlow);

  // Electron
  const electronGeo=new THREE.SphereGeometry(.3,16,16);
  const electronMat=new THREE.MeshStandardMaterial({
    color:0x00e5ff,
    emissive:0x00e5ff,
    emissiveIntensity:1,
    metalness:1,
    roughness:0
  });
  const electron=new THREE.Mesh(electronGeo,electronMat);
  orbGroup.add(electron);
  electronMeshes.push(electron);

  // Electron glow
  const eGlow=new THREE.Mesh(
    new THREE.SphereGeometry(.7,16,16),
    new THREE.MeshBasicMaterial({color:0x00e5ff,transparent:true,opacity:.3})
  );
  electron.add(eGlow);

  // Trail
  const trailLen=60;
  const trailPositions=new Float32Array(trailLen*3);
  const trailGeo=new THREE.BufferGeometry();
  trailGeo.setAttribute("position",new THREE.BufferAttribute(trailPositions,3));
  const trailMat=new THREE.LineBasicMaterial({color:orb.color,transparent:true,opacity:.4});
  const trail=new THREE.Line(trailGeo,trailMat);
  scene.add(trail);
  electronTrails.push({line:trail,positions:trailPositions,history:[]});
});

// Project nodes in 3D
const nodeGroup=new THREE.Group();
scene.add(nodeGroup);
const nodeMeshes=[];

projects.forEach((proj,i)=>{
  const group=new THREE.Group();
  const phi=Math.acos(-1+(2*(i+.5))/projects.length);
  const theta=Math.sqrt(projects.length*Math.PI)*phi;
  const radius=16;
  group.position.set(
    radius*Math.cos(theta)*Math.sin(phi),
    radius*Math.sin(theta)*Math.sin(phi)*.7,
    radius*Math.cos(phi)
  );
  group.userData={project:proj,index:i};

  // Node sphere
  const geo=new THREE.SphereGeometry(.4,16,16);
  const mat=new THREE.MeshStandardMaterial({
    color:0x00e5ff,
    emissive:0x00e5ff,
    emissiveIntensity:.6,
    metalness:.9,
    roughness:.1,
    transparent:true,
    opacity:.9
  });
  const mesh=new THREE.Mesh(geo,mat);
  group.add(mesh);

  // Node glow
  const nGlow=new THREE.Mesh(
    new THREE.SphereGeometry(.8,16,16),
    new THREE.MeshBasicMaterial({color:0x00e5ff,transparent:true,opacity:.15})
  );
  group.add(nGlow);

  // Connecting line to center
  const lineGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),group.position.clone().negate()]);
  const lineMat=new THREE.LineBasicMaterial({color:0x00e5ff,transparent:true,opacity:.1});
  const line=new THREE.Line(lineGeo,lineMat);
  nodeGroup.add(line);

  nodeGroup.add(group);
  nodeMeshes.push(group);
});

// Stars
const starsGeo=new THREE.BufferGeometry();
const starsCount=3000;
const starsPos=new Float32Array(starsCount*3);
for(let i=0;i<starsCount*3;i++){
  starsPos[i]=(Math.random()-.5)*200;
}
starsGeo.setAttribute("position",new THREE.BufferAttribute(starsPos,3));
const starsMat=new THREE.PointsMaterial({color:0xffffff,size:.15,transparent:true,opacity:.6});
scene.add(new THREE.Points(starsGeo,starsMat));

// Floating particles around atom
const partGeo=new THREE.BufferGeometry();
const partCount=500;
const partPos=new Float32Array(partCount*3);
for(let i=0;i<partCount;i++){
  const r=10+Math.random()*12;
  const t=Math.random()*Math.PI*2;
  const p=Math.acos(2*Math.random()-1);
  partPos[i*3]=r*Math.sin(p)*Math.cos(t);
  partPos[i*3+1]=r*Math.sin(p)*Math.sin(t);
  partPos[i*3+2]=r*Math.cos(p);
}
partGeo.setAttribute("position",new THREE.BufferAttribute(partPos,3));
const partMat=new THREE.PointsMaterial({color:0x00e5ff,size:.08,transparent:true,opacity:.3});
const particles=new THREE.Points(partGeo,partMat);
scene.add(particles);

// Mouse / Touch controls
let isDragging=false;
let prevMouse={x:0,y:0};
let rotVel={x:0,y:0};
let rotX=0,rotY=0;
let targetRotX=0,targetRotY=0;

function onPointerDown(e){
  isDragging=true;
  const point=e.touches?e.touches[0]:e;
  prevMouse={x:point.clientX,y:point.clientY};
}
function onPointerMove(e){
  if(!isDragging)return;
  const point=e.touches?e.touches[0]:e;
  const dx=point.clientX-prevMouse.x;
  const dy=point.clientY-prevMouse.y;
  rotVel.x=dx*.005;
  rotVel.y=dy*.005;
  targetRotY+=dx*.005;
  targetRotX+=dy*.005;
  targetRotX=Math.max(-Math.PI/3,Math.min(Math.PI/3,targetRotX));
  prevMouse={x:point.clientX,y:point.clientY};
}
function onPointerUp(){isDragging=false}
function onClick(e){
  if(e.target.closest(".modal"))return;
  const raycaster=new THREE.Raycaster();
  const mouse=new THREE.Vector2();
  mouse.x=(e.clientX/window.innerWidth)*2-1;
  mouse.y=-(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const intersects=raycaster.intersectObjects(nodeMeshes.map(g=>g.children[0]),false);
  if(intersects.length>0){
    const obj=intersects[0].object;
    const node=obj.parent;
    if(node.userData.project){
      showModal(node.userData.project);
    }
  }
}

renderer.domElement.addEventListener("mousedown",onPointerDown);
renderer.domElement.addEventListener("mousemove",onPointerMove);
renderer.domElement.addEventListener("mouseup",onPointerUp);
renderer.domElement.addEventListener("mouseleave",onPointerUp);
renderer.domElement.addEventListener("touchstart",onPointerDown,{passive:true});
renderer.domElement.addEventListener("touchmove",onPointerMove,{passive:true});
renderer.domElement.addEventListener("touchend",onPointerUp);
renderer.domElement.addEventListener("click",onClick);

function showModal(p){
  document.getElementById("modalIcon").textContent=p.icon;
  document.getElementById("modalTitle").textContent=p.name;
  document.getElementById("modalDesc").textContent=p.desc;
  document.getElementById("modalLink").href=p.url;
  document.getElementById("modalOverlay").classList.add("active");
}
function closeModal(){
  document.getElementById("modalOverlay").classList.remove("active");
}
document.getElementById("modalOverlay").addEventListener("click",function(e){
  if(e.target===this)closeModal();
});

// Clock
function updateClock(){
  const now=new Date();
  document.getElementById("clock").textContent=now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
setInterval(updateClock,1000);
updateClock();

// Animate
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();

  if(!isDragging){
    rotVel.x*=.95;
    rotVel.y*=.95;
    targetRotY+=rotVel.x;
    targetRotX+=rotVel.y;
    targetRotX=Math.max(-Math.PI/3,Math.min(Math.PI/3,targetRotX));
  }

  rotX+=(targetRotX-rotX)*.05;
  rotY+=(targetRotY-rotY)*.05;
  rotY+=.001;

  nucleusGroup.rotation.x=rotX;
  nucleusGroup.rotation.y=rotY;
  nucleusGroup.rotation.z=t*.15;

  nodeGroup.rotation.x=rotX;
  nodeGroup.rotation.y=rotY;

  // Orbit electrons
  orbitals.forEach((orb,i)=>{
    const radius=8+i*3;
    const angle=t*orb.speed*(i%2===0?1:-1);
    const e=electronMeshes[i];
    e.position.set(Math.cos(angle)*radius,0,Math.sin(angle)*radius);

    // Trail update
    const trail=electronTrails[i];
    const worldPos=new THREE.Vector3();
    e.getWorldPosition(worldPos);
    trail.history.push(worldPos.x,worldPos.y,worldPos.z);
    if(trail.history.length>60*3)trail.history.splice(0,3);
    for(let j=0;j<Math.min(trail.history.length,60*3);j++){
      trail.positions[j]=trail.history[j];
    }
    trail.line.geometry.attributes.position.needsUpdate=true;
    trail.line.geometry.setDrawRange(0,Math.floor(trail.history.length/3));
  });

  // Animate nucleus particles gently
  protons.forEach((p,i)=>{
    p.position.y+=Math.sin(t*2+i)*.002;
    p.position.x+=Math.cos(t*1.5+i)*.001;
  });
  neutrons.forEach((n,i)=>{
    n.position.z+=Math.sin(t*1.8+i)*.002;
  });

  // Node float
  nodeMeshes.forEach((node,i)=>{
    node.position.y+=Math.sin(t*.8+i*1.2)*.003;
    node.children[0].material.emissiveIntensity=.4+Math.sin(t*2+i)*.2;
    node.children[1].scale.setScalar(1+Math.sin(t*2+i)*.15);
  });

  // Particles rotation
  particles.rotation.y=t*.02;
  particles.rotation.x=t*.01;

  renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
